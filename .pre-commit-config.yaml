# Pre-commit hooks for agentic-coding-patterns
# Run: pre-commit install
# All hooks pinned to commit SHAs for supply chain security (except local hooks)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: ee6b38352380ce52369d16b7873093c4b8bf829b  # v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c60c980e561ed3e73101667fe8365c609d19a438  # v0.15.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 0d9fcb51a54f3b750b911c054b4bd1a590f1b592  # v0.43.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  # Commit message validation
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: e5287c0c191ba3f845841baf7e5852b74ab81f8d  # v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # GitHub Actions security scanning (optional - skips if zizmor not installed)
  # Install: cargo install zizmor OR brew install zizmor
  # Source: https://github.com/zizmorcore/zizmor
  # Manual run: zizmor .github/workflows/
  - repo: local
    hooks:
      - id: zizmor
        name: zizmor - GitHub Actions security scanner
        entry: bash -c 'command -v zizmor >/dev/null 2>&1 && zizmor "$@" || exit 0' --
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true

  # Pattern-specific validation (local hook)
  - repo: local
    hooks:
      - id: validate-patterns
        name: Validate pattern frontmatter
        entry: python scripts/validate_repo.py
        language: system
        pass_filenames: false
