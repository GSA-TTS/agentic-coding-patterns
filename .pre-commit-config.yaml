# Pre-commit hooks for agentic-coding-patterns
# Run: pre-commit install
# All hooks pinned to commit SHAs for supply chain security (except local hooks)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # v0.16.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Markdown linting. The version is pinned ONCE, in
  # .github/linters/package.json (+ package-lock.json, which also carries the
  # transitive CVE overrides and is what `npm audit` gates in CI). This hook
  # delegates to that install instead of pinning a second time via a remote
  # rev, so the two can never drift. Glob/ignore selection lives once in
  # .github/linters/run-markdownlint.mjs, shared with CI, so file selection
  # cannot drift between local and CI either.
  - repo: local
    hooks:
      # Local commits: auto-fix what is fixable.
      - id: markdownlint
        name: markdownlint (npm-pinned, --fix)
        entry: node .github/linters/run-markdownlint.mjs --fix
        language: system
        types: [markdown]
        pass_filenames: false
      # CI: check only, never --fix. With --fix the hook rewrites the file and
      # exits 0, so a real violation passes silently -- CI must use this id.
      # `stages: [manual]` keeps it out of the default commit-time run.
      - id: markdownlint-check
        name: markdownlint (npm-pinned, check only)
        entry: node .github/linters/run-markdownlint.mjs
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [manual]

  # NOTE: Conventional-commit format is enforced at the PR-title level by the
  # SHA-pinned amannn/action-semantic-pull-request Action (.github/workflows/
  # pr-lint.yml), consistent with playbook + quickstart. We intentionally do
  # NOT run a local commitlint pre-commit hook: it added a commitlint npm
  # dependency tree only this repo carried, for a check the merge gate already
  # performs. Squash-merge is preferred so the validated PR title becomes the
  # commit subject release-please consumes. (Issue #124)

  # NOTE: GitHub Actions security scanning (zizmor) runs in CI only —
  # see .github/workflows/zizmor.yml. It is intentionally NOT a local
  # pre-commit hook: the zizmor CLI hard-fails when GITHUB_TOKEN is set
  # but empty (common in sandboxed shells), which made the local hook
  # brittle. CI provides a valid token and scans on every workflow change.

  # Pattern-specific validation (local hook)
  - repo: local
    hooks:
      - id: validate-patterns
        name: Validate pattern frontmatter
        entry: python scripts/validate_repo.py
        language: unsupported
        pass_filenames: false
      - id: validate-acq-kits
        name: Validate acq-kits (hybrid/v1 schema)
        entry: python integrations/isolation/acq-kits/validate-kits.py --strict
        language: unsupported
        pass_filenames: false
