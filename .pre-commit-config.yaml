# Pre-commit hooks for agentic-coding-patterns
# Run: pre-commit install
# All hooks pinned to commit SHAs for supply chain security (except local hooks)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0671d8ab202c4ac093b78433ae5baf74f3fc7246  # v0.15.15
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Markdown linting (using markdownlint-cli2 for consistency with playbook)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda  # v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Commit message validation
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: e5287c0c191ba3f845841baf7e5852b74ab81f8d  # v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Pinned to the latest 19.x to match the hook's @commitlint/cli@^19
        # and the repo's exact-pinning policy (no floating ranges).
        additional_dependencies: ["@commitlint/config-conventional@19.8.1"]

  # NOTE: GitHub Actions security scanning (zizmor) runs in CI only —
  # see .github/workflows/zizmor.yml. It is intentionally NOT a local
  # pre-commit hook: the zizmor CLI hard-fails when GITHUB_TOKEN is set
  # but empty (common in sandboxed shells), which made the local hook
  # brittle. CI provides a valid token and scans on every workflow change.

  # Pattern-specific validation (local hook)
  - repo: local
    hooks:
      - id: validate-patterns
        name: Validate pattern frontmatter
        entry: python scripts/validate_repo.py
        language: unsupported
        pass_filenames: false
