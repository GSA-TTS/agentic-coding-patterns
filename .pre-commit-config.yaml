# Pre-commit hooks for agentic-coding-patterns
# Run: pre-commit install
# All hooks pinned to commit SHAs for supply chain security (except local hooks)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0671d8ab202c4ac093b78433ae5baf74f3fc7246  # v0.15.15
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Markdown linting (using markdownlint-cli2 for consistency with playbook)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda  # v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Commit message validation
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: e5287c0c191ba3f845841baf7e5852b74ab81f8d  # v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # GitHub Actions security scanning (optional - skips if zizmor not installed)
  # Install: cargo install zizmor OR brew install zizmor
  # Source: https://github.com/zizmorcore/zizmor
  # Manual run: zizmor .github/workflows/
  - repo: local
    hooks:
      - id: zizmor
        name: zizmor - GitHub Actions security scanner
        entry: bash -c 'command -v zizmor >/dev/null 2>&1 && zizmor "$@" || exit 0' --
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true

  # Pattern-specific validation (local hook)
  - repo: local
    hooks:
      - id: validate-patterns
        name: Validate pattern frontmatter
        entry: python scripts/validate_repo.py
        language: system
        pass_filenames: false
