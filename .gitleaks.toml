# Gitleaks Configuration for agentic-coding-patterns
# https://github.com/gitleaks/gitleaks
#
# Named .gitleaks.toml so the pre-commit gitleaks hook auto-loads it
# (gitleaks looks for .gitleaks.toml by default). Extends the default
# ruleset and adds allowlists for intentional example/educational secrets.

title = "Agentic Coding Patterns Gitleaks Config"

# Minimum gitleaks version required for this config
minVersion = "v8.25.0"

[extend]
# Use the default gitleaks rules as the base configuration
useDefault = true

[allowlist]
description = "Allow example API keys in documentation"

# Documented example secrets (educational purposes)
# These are fake keys used to show what NOT to do
regexes = [
  '''msk_live_abc123''',       # docs/getting-started.md:163 - Example bad practice
  '''msk_live_abcd1234xyz''',  # docs/safety-guidance.md:120 - Example bad practice
]

# Documentation paths with educational examples (docs + GitHub templates)
# These files teach users about prohibited content via examples
paths = [
  '''docs/getting-started\.md''',
  '''docs/safety-guidance\.md''',
  '''docs/test-cases-schema\.md''',
  '''.github/ISSUE_TEMPLATE/.*\.yml''',
  '''.github/pull_request_template\.md''',
  # Deliberate test fixtures: sample-vulnerable-code the security-review skill
  # scans for, and the sensitive-terms validator's own test inputs. Fake by
  # design; flagged by a full-history scan (public-readiness #292).
  '''skills/secure-code-review/tests/.*''',
  '''\.agents/skills/secure-code-review/tests/.*''',
  '''scripts/tests/test_validate_sensitive_terms\.py''',
]

# Patterns that explain security issues need example secrets
# These are clearly marked as "NEVER do this" examples
stopwords = [
  '''# NEVER hardcode''',
  '''NEVER hardcode''',
  '''Example bad practice''',
]
