# markdownlint configuration (plain markdownlint-cli, not markdownlint-cli2)
# Aligned with playbook standards for cross-repo consistency
# See: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
#
# Auto-discovered by `markdownlint-cli` (no --config flag needed) because its
# name matches one of the config filenames markdownlint-cli looks for.
#
# File selection (globs/ignores) is NOT configured here: markdownlint-cli
# takes globs and -i/--ignore flags directly as CLI arguments, resolved by
# its own glob engine (tinyglobby) rather than a hand-rolled walker. See
# .github/workflows/ci.yml and .pre-commit-config.yaml for the actual
# glob/ignore list — both must stay in sync, same requirement as before.

# MD003 - Heading style (disabled — mixed styles OK)
MD003: false
# MD007 - Unordered list indent (allow 2-space, frontmatter false positives)
MD007: false
# MD004 - Unordered list style (disabled — mixed markers OK)
MD004: false
# MD013 - Line length (disabled — long lines OK in docs)
MD013: false
# MD022 - Headings should be surrounded by blank lines
MD022: false
# MD024 - No duplicate heading names (disabled — repeated names OK)
MD024: false
# MD025 - Single top-level heading (disabled — multiple H1 OK for SKILL.md)
MD025: false
# MD026 - No trailing punctuation in headings
MD026: false
# MD031 - Fenced code blocks surrounded by blank lines
MD031: false
# MD032 - Lists surrounded by blank lines
MD032: false
# MD033 - No inline HTML (disabled — HTML allowed)
MD033: false
# MD034 - No bare URLs
MD034: false
# MD036 - No emphasis used instead of heading (disabled — used intentionally for OWASP categories)
MD036: false
# MD040 - Fenced code blocks should have language
MD040: false
# MD041 - First line in file should be H1 (disabled — files have frontmatter)
MD041: false
# MD051 - Link fragments should be valid
MD051: false
# MD056 - Table column count
MD056: false
# MD058 - Tables should be surrounded by blank lines
MD058: false
# MD060 - Table column style spacing (disabled — manual formatting OK)
MD060: false

# Support YAML frontmatter (markdownlint already skips common frontmatter by
# default for most rules; this explicit regex is kept for parity with the
# prior .markdownlint-cli2.yaml config so behavior does not shift silently).
frontMatter: "/^---\\s*$[\\s\\S]*?^---\\s*$/m"
