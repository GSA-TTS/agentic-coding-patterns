# spec.yaml — openchamber (a neutral acq mixin kit, hybrid/v1)
#
# Runs OpenChamber, a web UI for OpenCode, inside the sandbox and points it at a
# managed OpenCode server. Applying this kit gives you a browser-based OpenCode
# in addition to the terminal TUI you get from `acq run opencode`. It is OPT-IN:
# it is not one of the default GSA kits. Apply it with an extra kit ref (see
# README.md "Usage").
#
# NEUTRAL (backend-agnostic) form. Converted from the former sbx kit
# (`sbx-kits/openchamber/`, schemaVersion "2") in the acq-kits migration
# follow-up (#223); see
# integrations/isolation/docs/decisions/0001-neutral-hybrid-v1-acq-kits.md and
# this kit's docs/decisions/. The inline startup shell of the old sbx kit was
# extracted into a standalone script (files/home/openchamber-start.sh), matching
# how agentic-coding-playbook handles its startup script.
#
# Behavior (unchanged from the sbx kit):
#   - caps.network: allow egress to the OpenChamber install sources (npm registry,
#     the install-script host, and the GitHub release-asset hosts the prebuilt
#     better-sqlite3 binary comes from). Default-deny otherwise. The install
#     script is fetched from a PINNED tag and SHA-256-verified before it runs.
#   - files: drop the extracted startup script into the agent home.
#   - commands (phase startup, agent uid): run the script IN THE BACKGROUND. It
#     (a) installs OpenChamber on first boot, then (b) supervises a headless
#     `opencode serve` on 127.0.0.1:4096 and OpenChamber bound to 0.0.0.0. Both
#     run under a respawn loop, so if either process exits (an interactive
#     self-update — which needs a restart to take effect — or a crash) it is
#     restarted after a few seconds (OPENCHAMBER_RESTART_DELAY, default 5). No
#     systemd. Idempotent: no-ops if a supervisor for each service is already up.
#     There is deliberately NO install phase — see the install note below.
#
# Why the script runs in the BACKGROUND: the supervisor loops never exit (they
# respawn forever), so the startup command must not block sandbox start. The
# neutral spec has no `background` field, so the backgrounding is expressed two
# ways: the command backgrounds the script itself (`sh …openchamber-start.sh &`),
# and backend_extras.sbx.background:true carries the native sbx hint for the sbx
# adapter. The script's own supervisor subshells are already backgrounded within
# it, so even a foreground-only backend does not hang (the `&` on the invocation
# is what matters).
#
# Why install at STARTUP, not an install phase: @openchamber/web depends on
# better-sqlite3, a NATIVE module whose npm install runs
# `prebuild-install || node-gyp rebuild` — it downloads a prebuilt binary and
# only compiles from source if that fails. The opencode base image has no C
# toolchain, so a failed download means the compile fails too; as a CREATE-TIME
# install hook that non-zero exit crashes sandbox create. Installing at startup
# keeps it OFF the create path (a failure degrades to "UI unavailable", never a
# dead sandbox) and is where the egress proxy + its CA are fully usable.
#
# AUTH: `opencode serve` requires HTTP Basic auth (unauthenticated requests get
# 401). The script generates a per-sandbox password once (stored at
# ~/.local/state/openchamber/opencode-server-password, mode 600) and exports it
# as OPENCODE_SERVER_PASSWORD for both `opencode serve` and OpenChamber, so they
# share one credential. It is a sandbox-local secret, not host key material.
#
# PORT FORWARDING: OpenChamber binds container port 3000. The neutral spec does
# not model published ports, so the sbx port-publish declaration (map 3000 to an
# ephemeral host loopback port, per sandbox) lives under backend_extras.sbx. See
# the README backend-parity note.
schemaVersion: "hybrid/v1"
kind: mixin
name: openchamber
displayName: OpenChamber (web UI for OpenCode)
description: >
  Runs OpenChamber, a browser UI for OpenCode, inside the sandbox alongside the
  terminal TUI. Installs the OpenChamber CLI on first boot, then supervises a
  managed OpenCode server on 127.0.0.1:4096 and OpenChamber on 0.0.0.0:3000,
  restarting either if it exits. Opt-in mixin; composes with the USAi provider
  and the other GSA kits. The browser and the default TUI do not share live
  session state — attach a terminal to the managed server to share (see
  agentContext).

caps:
  network:
    allow:
      # 1. The install script is fetched from GitHub raw (at startup, first boot),
      #    from a PINNED tag — not `main` (see the pins in the startup command).
      - raw.githubusercontent.com
      # 2. npm downloads @openchamber/web and its deps from the npm registry.
      - registry.npmjs.org
      - "*.npmjs.org"
      # 3. @openchamber/web depends on better-sqlite3, a native module whose
      #    install downloads a PREBUILT binary from GitHub release assets (and only
      #    compiles from source if that download is blocked — which fails here, no
      #    toolchain). Allow the release-asset hosts so it always uses the prebuilt.
      - github.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com

files:
  - path: /home/agent/openchamber-start.sh
    mode: "0755"
    source: files/home/openchamber-start.sh
    description: Install (first boot) and supervise the managed opencode server + OpenChamber

commands:
  # Run the extracted startup script as the agent user at every start, IN THE
  # BACKGROUND (trailing `&`) so the never-exiting supervisor loops don't block
  # sandbox start. The OpenChamber release pins are exported here (the script
  # also carries matching fallback defaults); bump BOTH together with the
  # script's defaults to adopt a newer release. See docs/decisions/.
  - phase: startup
    user: "1000"
    description: Install (first boot) and supervise opencode serve + OpenChamber (background)
    command:
      - sh
      - -c
      - |
        OPENCHAMBER_REF="v1.9.10" \
        OPENCHAMBER_INSTALL_SHA256="aa268c96ddc6d7d53fc54d2e5c2312e689493ecef6ba4f69730a93d50cf33287" \
          sh /home/agent/openchamber-start.sh &

agentContext: |
  ## OpenChamber (web UI for OpenCode)

  This sandbox runs **OpenChamber**, a browser UI for OpenCode, in the
  background on container port 3000. A managed `opencode serve` runs on
  `127.0.0.1:4096`; OpenChamber drives that server.

  **Reaching it from the host.** The kit declares container port 3000, which
  acq's active backend maps to an ephemeral host port on 127.0.0.1, allocated
  per sandbox (so multiple sandboxes running this kit don't collide — each gets
  its own host port). Find the assigned port and open it:

  ```
  acq ports <sandbox>        # (sbx ports <sandbox>) — lists the host port for container 3000
  # then open http://127.0.0.1:<host-port>
  ```

  For a stable/chosen host port, publish it explicitly:
  `sbx ports <sandbox> --publish 3000:3000`.

  **Session sharing (important).** The terminal TUI you get from
  `acq run opencode` starts its OWN in-process OpenCode server, so it does
  **not** share live session state with the OpenChamber browser (which uses the
  managed server on `:4096`). Session *history* is on disk and reachable from
  both, but a live, in-flight run is not shared.

  To drive the **same** server from a terminal — so the terminal and the
  browser share one live session — attach to the managed server instead of
  launching a fresh TUI. The managed server requires Basic auth with a
  per-sandbox password the kit generated; pass it via `OPENCODE_SERVER_PASSWORD`:

  ```
  acq exec <sandbox> -- sh -lc \
    'OPENCODE_SERVER_PASSWORD="$(cat ~/.local/state/openchamber/opencode-server-password)" \
       opencode attach http://127.0.0.1:4096'
  ```

  Logs: `/tmp/openchamber.log` and `/tmp/opencode-serve.log` inside the sandbox.
  Both services run under a respawn loop, so if `opencode serve` or OpenChamber
  exits — for example after an interactive self-update, which needs a restart to
  take effect — it comes back a few seconds later on its own. Those logs show
  `[supervisor] ... restarting` lines when that happens.

# Backend extras: the neutral spec does not model published ports or a
# background-command flag, so the sbx-native bits live here. The sbx adapter
# publishes container port 3000 (mapped to an ephemeral host loopback port per
# sandbox — IMMUTABLE at create time, so apply this kit at create time) and
# marks the startup command as a background hook. These are per-backend hints,
# human-review-only (not schema-enforced); other backends express the same
# behavior their own way (see the README backend-parity note). No
# backend_shortcuts: every backend runs the same install+supervise script.
backend_extras:
  sbx:
    publishedPorts:
      - container: 3000
        protocol: tcp
        name: openchamber
    background: true
