# spec.yaml — prime-agent (a neutral acq mixin kit, hybrid/v1)
#
# SKELETON (GSA-TTS/agentic-coding-patterns#369): this issue lands the kit SHAPE
# only — the spec.yaml here is complete and must pass `make validate-kits`, but
# the three lifecycle scripts are MINIMAL, SAFE PLACEHOLDERS. Their real bodies
# (install, CA-bundle wiring, IPython/Jupyter kernel bootstrap, and the
# models.json install step) are fleshed out in the follow-up issues
# GSA-TTS/agentic-coding-patterns#370/#371/#372/#373. Do NOT read the current
# script bodies as the intended behavior.
#
# WHAT prime-agent IS: PrimeIntellect-ai/prime-agent (MIT) — an AI coding
# assistant with an embedded IPython tool. It is a terminal UI (TUI), NOT a web
# UI, so this kit publishes NO ports (see the missing `publishedPorts:` below —
# contrast with the sibling `paseo` and `openchamber` kits, which each publish a
# browser UI port).
#
# NEUTRAL (backend-agnostic) hybrid/v1 form, structured like the sibling
# `paseo` / `openchamber` / `usai-provider` kits. acq's kit-translate layer maps
# the declarative caps/files/commands/environment below onto whichever isolation
# backend acq has active (sbx, msb) — this kit carries no backend-specific config.
#
# DESIGN (to be finalized as the follow-up scripts land):
#   - INSTALL phase (prime-agent-install.sh) runs once at create time, as root
#     (uid "0"), to install the prime-agent CLI and its runtime. Running install
#     at create time (not startup) matches the neutral phase vocabulary: install =
#     root, create-time once. The real install/CA-bundle logic is #370/#371.
#   - STARTUP phase runs on EVERY sandbox start as the agent user (uid "1000"):
#       1. prime-agent-install-models-json.sh drops the USAi model catalog
#          (files/home/prime-agent-config/models.json) into prime-agent's config
#          location so the agent can talk to the model provider. The catalog file
#          is GENERATED by the USAi catalog prime-agent emitter (#362) — see the
#          files[] note. This step is fleshed out in #372.
#       2. prime-agent-bootstrap-kernel.sh brings up prime-agent's IPython kernel
#          (the embedded IPython tool needs a live kernel). Fleshed out in #373.
#     Neither startup step is `background: true`: they run to completion and exit
#     (they set up state; they are not never-exiting supervisor loops), unlike the
#     web-UI kits' supervisors.
#
# EGRESS (deny-by-default): the allow-list below is prime-agent's OWN install and
# runtime hosts only. Model-provider egress (api.gsa.usai.gov) is deliberately
# NOT here — that is the `usai-provider` kit's job, and prime-agent composes with
# it. NOTE (YAML alias trap, documented by paseo): acq's kit translation emits
# allow entries UNQUOTED, and a bare leading-`*` host (e.g. `- *.example.com`) is
# parsed by YAML as an alias, breaking the translated spec. NO entry here begins
# with a leading `*`.
schemaVersion: "hybrid/v1"
kind: mixin
name: prime-agent
displayName: Prime Agent (PrimeIntellect AI coding assistant, TUI)
description: >
  Installs PrimeIntellect-ai/prime-agent (MIT) inside the sandbox — a terminal
  AI coding assistant with an embedded IPython tool. Installs the CLI at create
  time, then on every start drops the USAi model catalog and bootstraps the
  IPython kernel. Publishes no ports (prime-agent is a TUI, not a web UI).
  Opt-in mixin; composes with the USAi provider and the other GSA kits. SKELETON
  only (#369); install/CA-bundle/kernel scripts are fleshed out in #370-#373.

caps:
  network:
    allow:
      # prime-agent's own application host (app UI / update checks).
      - app.primeintellect.ai:443
      # prime-agent's release/asset bundle CDN. GUESSED host — the exact
      # Cloudflare R2 public bucket subdomain (a `*.r2.dev` host) is not yet
      # confirmed. #370/#371 (the real install script + live testing) MUST
      # replace this with the verified bundle host. Flagged as a guess.
      - pub-placeholder-prime-agent-bundle.r2.dev:443
      # npm registry — prime-agent's install pulls npm packages. Metadata and
      # tarballs both come from registry.npmjs.org (npm's dist.tarball URLs
      # point here), so no wildcard subdomain is needed.
      - registry.npmjs.org:443
      # astral.sh / releases.astral.sh — the uv / Python toolchain installer
      # (Astral) prime-agent's Python/IPython runtime relies on.
      - astral.sh:443
      - releases.astral.sh:443
      # Python package index (IPython + kernel deps): pypi.org serves metadata,
      # files.pythonhosted.org serves the wheels/sdists.
      - pypi.org:443
      - files.pythonhosted.org:443
      # GitHub + release-asset hosts (source install / prebuilt release assets).
      - github.com:443
      - objects.githubusercontent.com:443

files:
  # Lifecycle scripts (PLACEHOLDERS in #369; real bodies in #370-#373). Mode 0755
  # (executable): each backend's file-drop materializes them at the in-guest path.
  - path: /home/agent/prime-agent-install.sh
    mode: "0755"
    source: files/home/prime-agent-install.sh
    description: Install the prime-agent CLI + runtime (create-time, root). Placeholder — fleshed out in #370/#371.
  - path: /home/agent/prime-agent-install-models-json.sh
    mode: "0755"
    source: files/home/prime-agent-install-models-json.sh
    description: Drop the USAi model catalog into prime-agent's config at startup. Placeholder — fleshed out in #372.
  - path: /home/agent/prime-agent-bootstrap-kernel.sh
    mode: "0755"
    source: files/home/prime-agent-bootstrap-kernel.sh
    description: Bootstrap prime-agent's IPython kernel at startup. Placeholder — fleshed out in #373.
  # The USAi model catalog prime-agent reads. GENERATED by the USAi catalog
  # prime-agent emitter (GSA-TTS/agentic-coding-patterns#362) — the emitter does
  # not exist yet, so the committed models.json is a minimal, valid PLACEHOLDER
  # (apiKey is the ENV-VAR NAME "USAI_API_KEY", not a secret; empty models[]).
  # The emitter replaces this file's contents later; do not hand-edit the model
  # list. Mode 0644 (read-only data, not executable).
  - path: /home/agent/prime-agent-config/models.json
    mode: "0644"
    source: files/home/prime-agent-config/models.json
    description: USAi model catalog for prime-agent — GENERATED by the #362 emitter (placeholder committed here).

commands:
  # INSTALL phase — create-time, once, as root (uid "0"). Installs the prime-agent
  # CLI + runtime. Real logic (incl. the CA bundle) lands in #370/#371.
  - phase: install
    user: "0"
    description: Install the prime-agent CLI + runtime (create-time). Placeholder body — #370/#371.
    command:
      - sh
      - /home/agent/prime-agent-install.sh
  # STARTUP phase — every start, as the agent user (uid "1000"). Schema-required:
  # the hybrid/v1 `user` field pattern is ^[0-9]+$ (a numeric uid, NOT a name), so
  # this MUST stay "1000" even though the agent uid is assigned at provision. Do
  # not "fix" this to `agent`; acq/the backend runs the startup phase as the agent
  # user. Neither step is background: true — both run to completion and exit.
  - phase: startup
    user: "1000"
    description: Install the USAi model catalog into prime-agent's config. Placeholder body — #372.
    command:
      - sh
      - /home/agent/prime-agent-install-models-json.sh
  - phase: startup
    user: "1000"
    description: Bootstrap prime-agent's IPython kernel. Placeholder body — #373.
    command:
      - sh
      - /home/agent/prime-agent-bootstrap-kernel.sh

# NO publishedPorts: prime-agent is a TUI, not a web UI. Nothing to publish to the
# host (contrast the sibling paseo/openchamber kits, which each publish a port).

# Non-secret guest env. PRIME_AGENT_INSTALLER_PLAIN suppresses the installer TUI
# so provision logs stay plain-text and readable (matches the kit family's
# convention of keeping create/startup output non-interactive). No secret here —
# the USAi API key is injected at runtime by the usai-provider kit / acq, never
# by this kit.
environment:
  PRIME_AGENT_INSTALLER_PLAIN: "1"

agentContext: |
  ## Prime Agent (PrimeIntellect AI coding assistant)

  This sandbox has **prime-agent** installed — a terminal AI coding assistant
  from PrimeIntellect (MIT) with an embedded **IPython** tool for running Python
  in-session. It is a TUI: there is no web UI and no published port.

  The kit installs the CLI at sandbox create time, then on every start it (1)
  drops the USAi model catalog into prime-agent's config and (2) bootstraps the
  IPython kernel the tool needs. Your model provider (USAi) is configured by the
  separate `usai-provider` kit; the API key is injected at runtime by `acq` and
  is never stored in this sandbox.

  > SKELETON NOTE (#369): this kit currently ships placeholder lifecycle scripts.
  > The real install, CA-bundle, and kernel-bootstrap logic lands in the
  > follow-up issues #370-#373, and the model catalog is generated by the USAi
  > catalog emitter (#362).

# No backend_shortcuts / backend_extras: this kit is written entirely in the
# neutral vocabulary (caps / files / commands / environment), which acq's kit
# translation feeds to whatever backend it has active (sbx, msb). No published
# port and no supervisor loop, so no per-backend detached/port primitives needed.
