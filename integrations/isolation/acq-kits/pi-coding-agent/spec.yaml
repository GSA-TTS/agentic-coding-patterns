# spec.yaml — pi-coding-agent (a neutral acq mixin kit, hybrid/v1)
#
# Installs earendil-works/pi (MIT), npm package @earendil-works/pi-coding-agent
# — a plain terminal AI coding agent that grants the model only read/write/
# edit/bash tools by DEFAULT (the binary ships a few more built-in tools —
# grep/find/ls/powershell — but they are not exposed to the model unless
# explicitly allowlisted via --tools; verified against pi's own README). By
# upstream design philosophy ("features other agents bake in, you build with
# extensions") pi has no built-in MCP support, no sub-agents, no permission
# popups, and no plan mode — and, unlike the sibling prime-agent kit, NO
# embedded Python/IPython kernel to bootstrap. This is the SIMPLEST kit in
# this family: ONE install step, at STARTUP, unprivileged, no install phase,
# no supervisor loop.
#
# SEQUENCING NOTE (per a completed consensus vote): this kit is being shipped
# AHEAD of the in-flight prime-agent kit (patterns epic #368) specifically to
# validate the unprivileged/agent-owned/startup-only pattern on a materially
# simpler target — pi's own installer needs no native-module postinstall step
# and no Python runtime, so there is no "install phase vs. startup phase,
# because a failed native build must not crash sandbox create" tension the way
# there is for openchamber's better-sqlite3 dependency. prime-agent's own
# heavier kernel-bootstrap complexity is deliberately deferred, not abandoned.
#
# WHAT pi-coding-agent IS: a TUI, not a web UI — like prime-agent (contrast
# openchamber / paseo, which each publish a browser-UI port). Publishes NO
# ports.
#
# Design rationale for the npm prefix choice and the CA-bundle wrapper lives
# in docs/decisions/. The install-method choice (npm registry, not
# pi.dev/install.sh) and the --ignore-scripts residual risk are each
# contained enough to stay where they're used: see README.md "Install
# method" and "Supply-chain notes", and this file's own commands: block and
# the install script's comments.
#
# MODEL PROVIDER CONFIG IS DELIBERATELY DEFERRED, not merely out of scope:
# pairing a models.json install step with a hand-written placeholder catalog
# (empty models[] array) provides ZERO functional value with no USAi-catalog
# pi emitter yet to populate it (contrast prime-agent's own placeholder,
# which ships a real, populated model list). Rather than ship functionless
# scaffolding, that step is cut from this kit entirely and will land
# together with the real emitter in a follow-up. This kit's own allow-list
# is pi's install host only; model-provider egress (e.g. api.gsa.usai.gov)
# remains the separate usai-provider kit's job either way.
#
# AGENTS.md / CLAUDE.md: pi supports project-level AGENTS.md/CLAUDE.md loading
# and a global ~/.pi/agent/AGENTS.md. This kit deliberately does NOT touch
# either — the same single-responsibility boundary prime-agent's kit draws
# around its own equivalent surface. Leave that to the user or another kit.
#
# NAMING: the kit is named `pi-coding-agent`, not the bare upstream
# shorthand `pi` — see README.md "Naming" for why.
schemaVersion: "hybrid/v1"
kind: mixin
name: pi-coding-agent
displayName: pi (earendil-works terminal coding agent)
description: >
  Installs earendil-works/pi (MIT), npm package
  @earendil-works/pi-coding-agent — a plain terminal AI coding agent that
  grants the model only read/write/edit/bash tools by default (no built-in
  MCP, sub-agents, permission popups, or plan mode). Installs via the
  standard npm registry path (npm install -g --ignore-scripts, an
  unprivileged per-user npm prefix, no pi.dev egress) at every sandbox start.
  Publishes no ports (a TUI, not a web UI); no install phase — the single
  install step is an unprivileged startup step, matching the family's
  settled unprivileged-startup pattern. Model-provider config (USAi
  models.json) is deliberately deferred to a follow-up once a USAi catalog
  emitter for pi exists — see the header comment. Opt-in mixin; composes
  with the USAi provider and the other GSA kits.

caps:
  network:
    allow:
      # The ONLY host this kit's install path needs: npm metadata AND
      # tarballs both resolve from registry.npmjs.org (no wildcard subdomain
      # needed — see openchamber's own note on why one host, unsuffixed, is
      # sufficient). Deliberately NOT pi.dev and NOT any
      # github.com/*.githubusercontent.com release-asset host — see
      # README.md "Install method" for why. This kit's egress surface is
      # intentionally the smallest in the family.
      - registry.npmjs.org

files:
  # Lifecycle script. Mode 0755 (executable). Builds a per-user npm prefix
  # (docs/decisions/local-prefix-not-npm-global.md), a per-boot CA trust
  # bundle, and the runtime wrapper that carries that bundle into `pi`'s own
  # invocations (docs/decisions/ca-bundle-wrapper-not-env-var.md).
  - path: /home/agent/pi-coding-agent-install.sh
    mode: "0755"
    source: files/home/pi-coding-agent-install.sh
    description: Install the pi CLI via npm (unprivileged, --ignore-scripts, per-user prefix, pinned version) at every start; no-op if already present.

commands:
  # STARTUP phase only — no install phase (see header DESIGN note). Runs to
  # completion and exits; not `background: true` (pi has no server to keep
  # alive, unlike openchamber's supervised UI). Schema-required: the
  # hybrid/v1 `user` field pattern is ^[0-9]+$ (a numeric uid, NOT a name),
  # so this MUST stay "1000" even though the agent uid is assigned at
  # provision and is not necessarily 1000 — acq/the backend runs the startup
  # phase as the agent user regardless of the literal value.
  - phase: startup
    user: "1000"
    description: Install the pi CLI via npm (unprivileged, idempotent, pinned version)
    command:
      - sh
      - /home/agent/pi-coding-agent-install.sh

# NO publishedPorts: pi is a TUI, not a web UI (same as prime-agent). Nothing
# to publish to the host.

agentContext: |
  ## pi (earendil-works terminal coding agent)

  This sandbox has **pi** installed — `@earendil-works/pi-coding-agent`, a
  plain terminal AI coding agent that grants the model only
  `read`/`write`/`edit`/`bash` tools by default. There is no built-in MCP
  support, no sub-agents, no permission popups, and no plan mode: pi is
  intentionally minimal, and extensions are the documented way to add
  capability.

  The kit installs the CLI on every sandbox start (idempotent — a no-op once
  installed) via the standard npm registry path, unprivileged. Model-provider
  configuration is not yet wired into this kit (see this kit's README for
  status); until it is, authenticate pi manually (`/login`, an environment
  variable, or `~/.pi/agent/auth.json` per pi's own docs).

  There is no published port and no supervisor loop — pi is a TUI you run
  directly (`pi`), and this kit does not manage a shared session the way the
  openchamber/paseo web-UI kits do.

# No backend_shortcuts / backend_extras: this kit is written entirely in the
# neutral vocabulary (caps / files / commands), which acq's kit translation
# feeds to whatever backend it has active (sbx, msb). No published port and
# no background/supervisor primitive needed.
