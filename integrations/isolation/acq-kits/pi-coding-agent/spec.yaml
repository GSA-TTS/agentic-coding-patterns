# spec.yaml — pi-coding-agent (a neutral acq mixin kit, hybrid/v1)
#
# Installs earendil-works/pi (MIT), npm package @earendil-works/pi-coding-agent
# — a plain terminal AI coding agent that grants the model only read/write/
# edit/bash tools by DEFAULT (the binary ships a few more built-in tools —
# grep/find/ls/powershell — but they are not exposed to the model unless
# explicitly allowlisted via --tools; verified against pi's own README). By
# upstream design philosophy ("features other agents bake in, you build with
# extensions") pi has no built-in MCP support, no sub-agents, no permission
# popups, and no plan mode — and, unlike the sibling prime-agent kit, NO
# embedded Python/IPython kernel to bootstrap. This is the SIMPLEST kit in
# this family: ONE install step, at STARTUP, unprivileged, no install phase,
# no supervisor loop.
#
# SEQUENCING NOTE (per a completed consensus vote): this kit is being shipped
# AHEAD of the in-flight prime-agent kit (patterns epic #368) specifically to
# validate the unprivileged/agent-owned/startup-only pattern on a materially
# simpler target — pi's own installer needs no native-module postinstall step
# and no Python runtime, so there is no "install phase vs. startup phase,
# because a failed native build must not crash sandbox create" tension the way
# there is for openchamber's better-sqlite3 dependency. prime-agent's own
# heavier kernel-bootstrap complexity is deliberately deferred, not abandoned.
#
# WHAT pi-coding-agent IS: a TUI, not a web UI — like prime-agent (contrast
# openchamber / paseo, which each publish a browser-UI port). Publishes NO
# ports.
#
# INSTALL METHOD — npm registry, NOT pi.dev/install.sh: pi.dev publishes a
# curl-pipe-to-shell installer, but this kit deliberately does NOT fetch it.
# Two independent reasons, both verified live this session:
#   1. pi.dev's installer is a MUTABLE live script whose logic can change
#      without notice, and it runs an INTERACTIVE Homebrew/apt/apk/standalone-
#      Node preflight path when Node/npm are missing — meaningless in a
#      non-interactive startup script. Installing Node itself is out of scope
#      for this kit (the base image is expected to already carry Node, the
#      same assumption openchamber makes for its own base image).
#   2. `npm install -g @earendil-works/pi-coding-agent` needs ONLY
#      registry.npmjs.org — no pi.dev egress at all. A live msb network probe
#      (both a bare demo sandbox and an acq-provisioned one) found
#      registry.npmjs.org reachable in both cases, while pi.dev was refused in
#      the bare sandbox and blocked by this deployment's Zscaler TLS-inspecting
#      proxy in the other (neither result implicates this kit's own design —
#      both are the deny-by-default egress model and the host's own CA-trust
#      chain working as intended on hosts that have not been given a route to
#      pi.dev) — a real signal that depending on pi.dev directly adds egress
#      risk this kit does not need to take on. This mirrors the exact
#      reasoning that made the sibling prime-agent kit avoid depending on
#      app.primeintellect.ai's live install.sh for its own bundle-fetch step.
#   pi.dev is therefore DELIBERATELY ABSENT from caps.network.allow below.
#   Open question, not yet verified: does the installed `pi` binary itself
#   phone home to pi.dev at runtime (update checks, telemetry)? If a future
#   live trace of a running `pi` session finds that it does, add the host then
#   with a live-tested justification — do not allow-list it speculatively now.
#
# WHY NOT `--ignore-scripts` LEAVES ANY RESIDUAL RISK: verified against the
# published npm registry metadata for @earendil-works/pi-coding-agent — its
# package.json declares NO preinstall/postinstall lifecycle script, so
# --ignore-scripts (which this kit's install script also passes, matching
# pi's own installer) has nothing to skip; there is no native-module
# postinstall step here the way openchamber's better-sqlite3 dependency has,
# so this kit needs none of openchamber's github.com/*.githubusercontent.com
# release-asset allow-list entries. IMPORTANT residual-risk note:
# --ignore-scripts blocks npm LIFECYCLE hooks (preinstall/postinstall) for
# this package and its transitive deps — it does NOT vet or sandbox the code
# that runs when the installed `pi` binary is later INVOKED. A compromised
# @earendil-works/pi-coding-agent package does not need a postinstall hook at
# all; it can put a payload directly in the code path that runs on `pi`'s
# first invocation, with full agent-user privilege. --ignore-scripts removes
# the install-time hook vector only, not the runtime one — the ephemeral,
# single-tenant sandbox (no host FS, proxied/allow-listed egress) remains the
# real containment boundary, exactly as documented for every sibling kit's
# threat model.
#
# VERSION PIN: PI_CODING_AGENT_VERSION defaults to a specific, reviewed
# release (see pi-coding-agent-install.sh) rather than "latest" — this kit's
# behavior must not silently drift to whatever npm resolves as newest on every
# sandbox boot. Bump the pin deliberately, as its own reviewed change.
#
# CA-bundle: pi is a plain npm-installed Node CLI that will make HTTPS
# requests (both during its own npm install, and later to whichever LLM
# provider API it's configured against). It needs the EXACT SAME
# NODE_EXTRA_CA_CERTS bundle pattern as openchamber/paseo/prime-agent — proxy
# CA + system trust store concatenated, because NODE_EXTRA_CA_CERTS only
# APPENDS to Node's built-in roots and an inspecting proxy's CA is not in
# either set on its own. This is load-bearing, not defensive: the
# SELF_SIGNED_CERT_IN_CHAIN failure mode this guards against has already been
# verified live for prime-agent's own npm install path, and this session's own
# live probe against a Zscaler-inspected host reproduced the analogous
# "unable to get local issuer certificate" failure directly. See
# pi-coding-agent-install.sh, which ADAPTS the block from openchamber's own
# script (same structure and trust rationale, with decode-failure surfacing
# added — see that script's comment for the full diff). The proxy CA itself
# is read from the PROXY_CA_CERT_B64 environment variable (base64-encoded
# PEM) — the same variable name openchamber/paseo already read; not declared
# under this kit's own `environment:` block below because it is supplied by
# whatever injects a proxy CA into the sandbox (e.g. the zscaler-ca-certificate
# kit's own mechanism, or the operator's environment), not by this kit
# itself — this kit only ever reads it, never sets or requires it.
#
# MODEL PROVIDER CONFIG IS DELIBERATELY DEFERRED, not merely out of scope: an
# earlier draft of this kit also shipped a models.json install step and a
# hand-written placeholder catalog with an empty models[] array. Review found
# that pairing provides ZERO functional value with no USAi-catalog pi emitter
# yet to populate it (contrast prime-agent's own placeholder, which ships a
# real, populated model list). Rather than ship functionless scaffolding, that
# step is cut from this kit entirely and will land together with the real
# emitter in a follow-up. This kit's own allow-list is pi's install host only;
# model-provider egress (e.g. api.gsa.usai.gov) remains the separate
# usai-provider kit's job either way.
#
# AGENTS.md / CLAUDE.md: pi supports project-level AGENTS.md/CLAUDE.md loading
# and a global ~/.pi/agent/AGENTS.md. This kit deliberately does NOT touch
# either — the same single-responsibility boundary prime-agent's kit draws
# around its own equivalent surface. Leave that to the user or another kit.
#
# NAMING: the kit is named `pi-coding-agent` (matching the npm package name),
# not the bare upstream shorthand `pi`. A bare `pi` kit name would collide
# conceptually with the ubiquitous mathematical constant/variable name in
# every log line, script, and error message this kit produces — a real
# ambiguity risk unique to this product's name that none of the sibling kits'
# names (openchamber/paseo/prime-agent/zscaler-ca-certificate) share. Every
# file, script, and log line in this kit says "pi-coding-agent," never bare
# "pi," for the same reason.
schemaVersion: "hybrid/v1"
kind: mixin
name: pi-coding-agent
displayName: pi (earendil-works terminal coding agent)
description: >
  Installs earendil-works/pi (MIT), npm package
  @earendil-works/pi-coding-agent — a plain terminal AI coding agent that
  grants the model only read/write/edit/bash tools by default (no built-in
  MCP, sub-agents, permission popups, or plan mode). Installs via the
  standard npm registry path (npm install -g --ignore-scripts, an
  unprivileged per-user npm prefix, no pi.dev egress) at every sandbox start.
  Publishes no ports (a TUI, not a web UI); no install phase — the single
  install step is an unprivileged startup step, matching the family's
  settled unprivileged-startup pattern. Model-provider config (USAi
  models.json) is deliberately deferred to a follow-up once a USAi catalog
  emitter for pi exists — see the header comment. Opt-in mixin; composes
  with the USAi provider and the other GSA kits.

caps:
  network:
    allow:
      # The ONLY host this kit's install path needs: npm metadata AND
      # tarballs both resolve from registry.npmjs.org (no wildcard subdomain
      # needed — see openchamber's own note on why one host, unsuffixed, is
      # sufficient). Deliberately NOT pi.dev (see the header's "INSTALL
      # METHOD" note) and NOT any github.com/*.githubusercontent.com
      # release-asset host (no native module, no postinstall script — see
      # the header's "WHY NOT --ignore-scripts" note): this kit's egress
      # surface is intentionally the smallest in the family.
      - registry.npmjs.org

files:
  # Lifecycle script. Mode 0755 (executable).
  - path: /home/agent/pi-coding-agent-install.sh
    mode: "0755"
    source: files/home/pi-coding-agent-install.sh
    description: Install the pi CLI via npm (unprivileged, --ignore-scripts, per-user prefix, pinned version) at every start; no-op if already present.

commands:
  # STARTUP phase only — no install phase (see header DESIGN note). Runs to
  # completion and exits; not `background: true` (pi has no server to keep
  # alive, unlike openchamber's supervised UI). Schema-required: the
  # hybrid/v1 `user` field pattern is ^[0-9]+$ (a numeric uid, NOT a name),
  # so this MUST stay "1000" even though the agent uid is assigned at
  # provision and is not necessarily 1000 — acq/the backend runs the startup
  # phase as the agent user regardless of the literal value.
  - phase: startup
    user: "1000"
    description: Install the pi CLI via npm (unprivileged, idempotent, pinned version)
    command:
      - sh
      - /home/agent/pi-coding-agent-install.sh

# NO publishedPorts: pi is a TUI, not a web UI (same as prime-agent). Nothing
# to publish to the host.

agentContext: |
  ## pi (earendil-works terminal coding agent)

  This sandbox has **pi** installed — `@earendil-works/pi-coding-agent`, a
  plain terminal AI coding agent that grants the model only
  `read`/`write`/`edit`/`bash` tools by default. There is no built-in MCP
  support, no sub-agents, no permission popups, and no plan mode: pi is
  intentionally minimal, and extensions are the documented way to add
  capability.

  The kit installs the CLI on every sandbox start (idempotent — a no-op once
  installed) via the standard npm registry path, unprivileged. Model-provider
  configuration is not yet wired into this kit (see this kit's README for
  status); until it is, authenticate pi manually (`/login`, an environment
  variable, or `~/.pi/agent/auth.json` per pi's own docs).

  There is no published port and no supervisor loop — pi is a TUI you run
  directly (`pi`), and this kit does not manage a shared session the way the
  openchamber/paseo web-UI kits do.

# No backend_shortcuts / backend_extras: this kit is written entirely in the
# neutral vocabulary (caps / files / commands), which acq's kit translation
# feeds to whatever backend it has active (sbx, msb). No published port and
# no background/supervisor primitive needed.
