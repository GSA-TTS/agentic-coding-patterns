# spec.yaml — model-router-proxy (acq mixin kit, hybrid/v1)
#
# WHAT: route OpenCode through the model-router so every prompt auto-switches to
# the best model (graded reasoning scorer; optional LLM judge). OpenCode's usai
# provider is pointed (transparently) at the model-router-service, which rewrites
# the model per request and forwards to USAi.
#
# TWO MODES (MODEL_ROUTER_MODE, default in-sandbox):
#   in-sandbox (DEFAULT): run the full service on 127.0.0.1 INSIDE the sandbox,
#     reusing the usai-provider USAI_API_KEY + the sandbox Zscaler CA, then flip
#     OpenCode's baseURL to the loopback service. This is the shape that WORKS
#     TODAY: USAi (api.gsa.usai.gov) is only reachable from inside the GSA network
#     / behind Zscaler, and the sandbox is already there — so the decision service
#     must run here, not on cloud.gov. See
#     docs/decisions/0001-in-sandbox-mode-default-cloudgov-parked.md.
#   external (opt-in): run NO server; flip baseURL to a remote MODEL_ROUTER_URL
#     (a cloud.gov app, or a host-run service via the backend host alias). Use
#     once USAi is reachable from wherever the service is deployed.
#
# COMPOSES WITH: usai-provider (owns the usai block this kit flips; supplies
# USAI_API_KEY) and zscaler-ca-certificate (puts the proxy root in the sandbox
# trust store so the in-sandbox service can reach USAi over inspected TLS).
# Apply all three for in-sandbox mode.
#
# FAIL-SOFT: any failure (no python3, no key, fetch/dep/boot failure, service
# never ready) leaves OpenCode on the DIRECT USAi gateway and exits 0 — never a
# dead sandbox. The install script enforces this.
#
# NEUTRAL (backend-agnostic) hybrid/v1 form; acq maps files/commands onto the
# active backend (sbx, msb).
schemaVersion: "hybrid/v1"
kind: mixin
name: model-router-proxy
displayName: Model Router Proxy (auto-switch models for OpenCode; in-sandbox by default)
description: >
  Routes OpenCode's usai provider through the model-router so every prompt is
  auto-switched to the best model (graded reasoning score; optional LLM judge),
  streaming preserved. Default MODE=in-sandbox runs the service on 127.0.0.1
  inside the sandbox (reusing the usai-provider USAI_API_KEY + the sandbox
  Zscaler CA) and flips the usai baseURL to it — the shape that works while USAi
  is only reachable inside the GSA network. MODE=external instead flips baseURL
  to a remote service (cloud.gov/host). Fail-soft: any problem leaves OpenCode on
  the direct gateway. Compose with usai-provider (and zscaler-ca-certificate for
  in-sandbox).

caps:
  network:
    allow:
      # Fetch the pinned service tarball. GitHub serves source archives from
      # codeload (api.github.com 302s there); allow both so the fetch resolves.
      - codeload.github.com
      - api.github.com
      # in-sandbox mode: pip installs the service's deps wheels-only
      # (fastapi/uvicorn/httpx/pydantic) from the Python index + fastly CDN.
      - pypi.org
      - files.pythonhosted.org
      # in-sandbox mode: the service forwards to USAi — same host usai-provider
      # allow-lists. (external mode reaches its remote URL instead; add that
      # host to egress per deployment — it is NOT hardcoded here.)
      - api.gsa.usai.gov

files:
  - path: /home/agent/model-router-proxy-install.sh
    mode: "0755"
    source: files/home/model-router-proxy-install.sh
    description: >
      Startup: fetch the service at a pinned SHA; in-sandbox mode installs deps
      wheels-only (--target) and runs it on 127.0.0.1 reusing USAI_API_KEY + the
      sandbox CA; external mode flips baseURL to a remote MODEL_ROUTER_URL.
      Installs the model-router-toggle CLI either way.

# MODE selection (MODEL_ROUTER_MODE) defaults to in-sandbox — the install script
# runs the service on 127.0.0.1 in the sandbox. To use external mode, set it in
# the guest (uncomment below, or pass at runtime). external mode auto-detects the
# backend host alias for a host-run service (microsandbox ->
# host.microsandbox.internal, podman -> host.containers.internal, Docker ->
# host.docker.internal) unless MODEL_ROUTER_URL is set to a non-host target
# (e.g. a cloud.gov app). A host-shell `export` does NOT reach the guest; set it
# via a guest env or `acq exec <sbx> -- env MODEL_ROUTER_MODE=external
# MODEL_ROUTER_URL=https://<app>.app.cloud.gov model-router-toggle on`.
# environment:
#   MODEL_ROUTER_MODE: "external"
#   MODEL_ROUTER_URL: "https://model-router.app.cloud.gov"

commands:
  # Startup phase, as the agent user. Runs AFTER usai-provider's merge (both are
  # startup/user 1000; acq preserves file-drop-before-startup ordering). Idempotent
  # and fail-soft — see the script header.
  - phase: startup
    user: "1000"
    description: Run/route the model-router (in-sandbox by default) and point OpenCode at it
    command:
      - sh
      - /home/agent/model-router-proxy-install.sh

# No publishedPorts: in-sandbox mode binds 127.0.0.1 (loopback, consumed by
# OpenCode in-sandbox); external mode runs no server here. Nothing is exposed
# outside the sandbox either way.

agentContext: |
  ## Model Router Proxy (auto-switch)

  OpenCode's `usai` provider is routed through the **model-router**, so **every
  prompt is auto-routed** to the model that best fits it (cheap/fast for trivial
  edits, strong-reasoning for hard tasks). By default the decision service runs
  **inside this sandbox** on `127.0.0.1` (USAi is only reachable from inside the
  GSA network, so the service must run here); it can instead point at an external
  service. Routing is transparent; the chosen model is reported in the
  `x-model-router-decision` response header and the service's decision log at
  `~/.local/state/model-router-proxy/decisions.jsonl`.

  Controls (installed on PATH):
  - `model-router-toggle status` — show whether routing is ON and the service is up
  - `model-router-toggle off` / `on` — stop/start routing (restart the OpenCode
    session for the change to take effect — baseURL is read at init)
  - `model-router feedback --last --model <id>` then `model-router recalibrate` —
    correct a bad route and re-tune the reasoning thresholds

  If the service is unreachable, OpenCode still talks to USAi directly — routing
  is a convenience, never a hard dependency.
