# spec.yaml — model-router-proxy (acq mixin kit, hybrid/v1)
#
# WHAT: point OpenCode at an EXTERNAL model-router service so every prompt
# auto-routes to the best model (graded reasoning scorer; optional LLM judge).
# This is the request-path, AUTO-SWITCHING counterpart to the advisory
# `model-router` MCP kit — see that kit's docs/proposals/model-router-proxy-kit.md.
#
# SHAPE (external service; the kit does NOT run a server in-sandbox):
#   - the model-router-service runs WHERE YOU DEPLOY IT: your localhost during
#     dev (reachable from the sandbox as e.g. host.docker.internal) or a
#     cloud.gov app in a real environment.
#   - this kit fetches ONLY the stdlib `model-router-toggle` CLI (at a pinned
#     SHA, public tarball), installs it on PATH, and flips OpenCode's usai
#     baseURL to MODEL_ROUTER_URL/v1. No pip install, no background process.
#   - MODEL_ROUTER_URL is REQUIRED (no default host) — the whole point of the
#     external shape. Pass it via ACQ_EXTRA_KITS env / the sandbox environment.
#
# COMPOSES WITH: usai-provider (owns the usai provider block this kit flips).
# The service holds its OWN upstream key where it is deployed, so this kit needs
# neither USAI_API_KEY nor the Zscaler CA in-sandbox (the SERVICE handles TLS to
# USAi on its side).
#
# FAIL-SOFT: a routing convenience. Any failure (no python3, no MODEL_ROUTER_URL,
# fetch failure) leaves OpenCode on the DIRECT USAi gateway and exits 0 — never a
# dead sandbox. The install script enforces this.
#
# NEUTRAL (backend-agnostic) hybrid/v1 form; acq maps files/commands onto the
# active backend (sbx, msb).
schemaVersion: "hybrid/v1"
kind: mixin
name: model-router-proxy
displayName: Model Router Proxy (route OpenCode at an external model-router service)
description: >
  Points OpenCode's usai provider at an EXTERNAL model-router service so every
  prompt is auto-routed to the best model (graded reasoning score; optional LLM
  judge) with streaming preserved. The service runs on your localhost (dev) or
  cloud.gov (real) — this kit only fetches the stdlib model-router-toggle CLI at
  a pinned SHA, installs it on PATH, and flips the usai baseURL to
  MODEL_ROUTER_URL/v1. Fail-soft: any problem leaves OpenCode on the direct
  gateway. Compose with usai-provider.

caps:
  network:
    allow:
      # Fetch ONLY the pinned toggle code (stdlib Python modules). GitHub serves
      # source archives from codeload (api.github.com 302s there); allow both.
      - codeload.github.com
      - api.github.com
      # NOTE: the external service URL (MODEL_ROUTER_URL) must be reachable from
      # the sandbox too. For a host-run service on Docker-based acq that is
      # host.docker.internal (loopback bridge, no allow-list entry needed); for a
      # cloud.gov service, add that app's host to the sandbox egress (e.g. via
      # the project's egress kit) — it is deployment-specific, so it is NOT
      # hardcoded here.

files:
  - path: /home/agent/model-router-proxy-install.sh
    mode: "0755"
    source: files/home/model-router-proxy-install.sh
    description: >
      Startup: fetch the stdlib toggle CLI at a pinned SHA, install it on PATH,
      and flip OpenCode's usai baseURL to the external MODEL_ROUTER_URL/v1.

# MODEL_ROUTER_URL selects the external service. By DEFAULT it is left UNSET so
# the install script AUTO-DETECTS the host alias for whichever backend is active
# (they differ: microsandbox -> host.microsandbox.internal, podman ->
# host.containers.internal, Docker -> host.docker.internal) and targets a
# host-run service on $MODEL_ROUTER_PORT (default 8080). Do NOT hardcode one
# alias here — it would override detection and break the other backends.
#
# To point at a NON-host target (e.g. cloud.gov), set it explicitly — in a guest
# env (uncomment below) or at runtime:
#   acq exec <sbx> -- env MODEL_ROUTER_URL=https://<app>.app.cloud.gov \
#     model-router-toggle --harness opencode on
# (a host-shell `export MODEL_ROUTER_URL=…` does NOT reach the guest), then
# restart the OpenCode session.
# environment:
#   MODEL_ROUTER_URL: "https://model-router.app.cloud.gov"

commands:
  # Startup phase, as the agent user. Runs AFTER usai-provider's merge (both are
  # startup/user 1000; acq preserves file-drop-before-startup ordering). Idempotent
  # and fail-soft — see the script header.
  - phase: startup
    user: "1000"
    description: Install the toggle CLI and route OpenCode at the external model-router service
    command:
      - sh
      - /home/agent/model-router-proxy-install.sh

# No publishedPorts: this kit runs no server. OpenCode talks to the EXTERNAL
# service at MODEL_ROUTER_URL (your localhost via the host bridge, or cloud.gov).

agentContext: |
  ## Model Router Proxy (auto-switch via an external service)

  OpenCode's `usai` provider is pointed at an **external model-router service**
  (`MODEL_ROUTER_URL`), so **every prompt is auto-routed** to the model that best
  fits it (cheap/fast for trivial edits, strong-reasoning for hard tasks). The
  service runs outside this sandbox — on the developer's host or a cloud.gov app.
  Routing is transparent; the chosen model is reported in the
  `x-model-router-decision` response header and the service's decision log.

  Controls (installed on PATH):
  - `model-router-toggle status` — show whether routing is ON and the service is up
  - `model-router-toggle off` / `on` — stop/start routing (restart the OpenCode
    session for the change to take effect — baseURL is read at init)

  If the external service is unreachable, OpenCode still talks to USAi directly —
  routing is a convenience, never a hard dependency.
