# 01-acq-shortnames.conf — podman short-name aliases (installed by the oci-engine
# kit into /etc/containers/registries.conf.d/).
#
# Remaps podman's built-in `hello`/`hello-world` short names back to Docker Hub
# (docker.io/library/hello-world) so a user migrating from Docker gets the image
# they expect. Paired with the Docker-Hub-first search-registry drop-in
# (00-acq-docker-first.conf, written by the install script). See ADR-0020.
[aliases]
"hello-world" = "docker.io/library/hello-world"
"hello" = "docker.io/library/hello-world"
