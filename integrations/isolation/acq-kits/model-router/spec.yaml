# spec.yaml — model-router (a neutral acq mixin kit, hybrid/v1)
#
# WHAT THIS KIT DOES: ships a small, dependency-free stdio MCP server that
# suggests the SMALLEST/cheapest available model that still satisfies a coding
# request's demands (reasoning depth, context length, modality) — or abstains
# when no model switch is warranted — and registers it with OpenCode at startup
# so the `model_select` tool is available to the agent. A companion skill
# (skill/SKILL.md) tells the agent WHEN to call it.
#
# INSPIRATION, NOT COPY: the SHAPE mirrors the public jev-skill-router
# (github.com/ydmw74/jev-skill-router) — a stdio MCP server that suggests at
# most one choice before the agent commits. The DECISION ENGINE is deliberately
# DIFFERENT: that project calls the proprietary, paid TypeSafe "Jev" Decisions
# API over the network, twice per request. This kit uses a local, deterministic,
# zero-dependency Python scorer (files/home/model-router/model_router.py) with an
# explicit capability profile per model family — no paid API, no network at
# runtime, no ML model download. At a ~10-model catalog this is cheaper, fully
# offline, and reliably unit-testable, the same rationale the repo's own
# .agents/skills/meta/pattern-router scorer documents. No scripts, prompt
# bodies, or skill bodies are copied from the reference; see
# templates/security-skill-intake.md convention in CONTRIBUTING for the
# inspiration-not-copy rule.
#
# WHY A SEPARATE KIT (not folded into usai-provider): single responsibility.
# usai-provider CONFIGURES the provider + model catalog; this kit ROUTES among
# whatever models are available. Compose them with two --kit flags. This kit
# reads (optionally) the live USAi id snapshot the usai-provider path can leave,
# but functions fully offline against a bundled default capability profile.
#
# FAIL-SOFT throughout: a model router is an optional convenience. Missing
# python3, an unparseable global config, or any scorer error degrades to
# "no suggestion / keep current model", never a dead sandbox. The only runtime
# requirement is python3 on PATH (standard library only — no pip, no venv, no
# egress).
#
# NO NETWORK: this kit declares NO caps.network.allow. The scorer and the MCP
# server make zero network calls; the capability profiles are bundled. (Refresh
# of the live USAi model LIST is the usai-provider kit's job, not this one.)
#
# NEUTRAL (backend-agnostic) form, structured like the sibling pi-coding-agent /
# openchamber kits. acq's kit-translate layer maps the declarative files/commands
# below onto whichever isolation backend acq has active (sbx, msb).
schemaVersion: "hybrid/v1"
kind: mixin
name: model-router
displayName: Model Router (request-aware model selection for OpenCode)
description: >
  Ships a small, dependency-free stdio MCP server that suggests the
  smallest/cheapest available model satisfying a coding request's demands
  (reasoning, context length, modality) — or abstains when no switch is
  warranted — and registers it with OpenCode at startup as the `model_select`
  tool. Open-source, offline, deterministic replacement for the proprietary
  TypeSafe/Jev decision API used by the jev-skill-router reference: a local
  Python scorer with an explicit per-family capability profile, no paid API and
  no network at runtime. A companion skill tells the agent when to call it.
  Model-provider configuration and catalog refresh are the separate
  usai-provider kit's job. Opt-in mixin; composes with the other GSA kits.

# NO caps.network: the router runs fully offline. Declaring no `allow` keeps the
# kit's egress surface empty — the smallest in the family.
#
# ADAPTER MODE (opt-in, central server): if an operator sets
# MODEL_ROUTER_ADAPTER_URL, the per-sandbox server forwards each decision to a
# shared central endpoint instead of scoring locally (adapter.py; falls back to
# the local scorer on any failure). Adapter mode is the ONLY path that makes a
# network call — and when it is used, the operator MUST add the central
# endpoint's host to the sandbox allow-list (e.g. compose a tiny mixin that
# contributes `caps.network.allow: [<central-host>]`, or add it to the active
# egress tier). This kit deliberately does NOT hardcode a central host. See
# docs/central-server.md and docs/decisions/0003-central-shared-server.md.

files:
  # The MCP server and its scorer/catalog modules. Pure standard-library Python;
  # no pip install, no venv, no compiled extension — dropped verbatim and run
  # in place. Each file needs its own entry (the neutral schema drops files, not
  # directories).
  - path: /home/agent/model-router/mcp_server.py
    mode: "0644"
    source: files/home/model-router/mcp_server.py
    description: Minimal stdio MCP server exposing the model_select tool (stdlib only)
  - path: /home/agent/model-router/model_router.py
    mode: "0644"
    source: files/home/model-router/model_router.py
    description: Deterministic, offline request-to-model scorer (no paid API, no ML download)
  - path: /home/agent/model-router/catalog.py
    mode: "0644"
    source: files/home/model-router/catalog.py
    description: Loads routing capability profiles (operator override, live USAi ids, or bundled default)
  - path: /home/agent/model-router/adapter.py
    mode: "0644"
    source: files/home/model-router/adapter.py
    description: Optional client that forwards decisions to a CENTRAL endpoint (adapter mode); unused unless MODEL_ROUTER_ADAPTER_URL is set
  - path: /home/agent/model-router/http_server.py
    mode: "0644"
    source: files/home/model-router/http_server.py
    description: Run the SAME scorer as a central HTTP decision service (for the shared-server deployment; not run inside the sandbox by default)
  - path: /home/agent/model-router/SKILL.md
    mode: "0644"
    source: files/home/model-router/SKILL.md
    description: Companion skill telling the agent WHEN to call model_select (installed into OpenCode's skills dir at startup)
  - path: /home/agent/model-router-install.sh
    mode: "0755"
    source: files/home/model-router-install.sh
    description: Self-test the scorer and register the MCP server in OpenCode's global config (startup, idempotent)

commands:
  # STARTUP phase only — no install phase. Nothing is fetched or compiled; the
  # step self-tests the scorer and merges a single `mcp.model-router` entry into
  # OpenCode's global config (preserving all other keys). Idempotent: re-running
  # converges to the same config. The hybrid/v1 `user` field pattern is ^[0-9]+$
  # (a numeric uid); acq/the backend runs the startup phase as the agent user
  # regardless of the literal value, matching the sibling kits' "1000".
  - phase: startup
    user: "1000"
    description: Self-test the scorer and register the model-router MCP server with OpenCode
    command:
      - sh
      - /home/agent/model-router-install.sh

# NO publishedPorts: the MCP server speaks stdio to its OpenCode host, not a
# network port. Nothing to publish (same as pi-coding-agent / the opencode kit).

agentContext: |
  ## Model Router (request-aware model selection)

  This sandbox has a **model-router** MCP server registered with OpenCode. It
  exposes one tool, `model_select(request)`, that suggests the
  smallest/cheapest available model which still satisfies a request's demands
  (reasoning depth, context length, image input), or **abstains** when no model
  switch is warranted (e.g. a plain prose question).

  The suggestion is **advisory** — you keep your own judgement and may ignore it
  if it does not fit what the user actually asked for. There is no server to
  manage and no port: the tool runs on demand, offline, with no paid API.

# No backend_shortcuts / backend_extras: written entirely in the neutral
# vocabulary (files / commands), which acq's kit translation feeds to whatever
# backend it has active (sbx, msb). No published port, no background supervisor.
