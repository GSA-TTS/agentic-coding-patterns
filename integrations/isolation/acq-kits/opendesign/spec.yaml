# spec.yaml — opendesign (a neutral acq mixin kit, hybrid/v1)
#
# Runs OpenDesign (https://github.com/nexu-io/open-design) headlessly inside an
# acq sandbox and publishes its browser UI / daemon to the host. OpenDesign is a
# local-first design workspace that launches existing agent CLIs; this kit does
# NOT install OpenCode or own model-provider credentials. It composes with the
# usai-provider kit, which injects USAI_API_KEY and configures OpenCode.
#
# DESIGN:
#   - Startup, not create-time install. OpenDesign is built from source, needs
#     Node 24 + pnpm 10.33.2, and may compile native dependencies. A transient
#     npm/GitHub/proxy failure should make the UI unavailable, not kill sandbox
#     creation. The startup script is fail-soft and supervised.
#   - Kit-managed Node 24. The OpenCode sandbox base may carry another Node major,
#     so this kit downloads a pinned Linux Node 24 archive into its persistent
#     volume and verifies SHA-256 before use.
#   - OpenDesign runs as a headless daemon: `od --host 0.0.0.0 --port 7456
#     --no-open`. In-guest 0.0.0.0 is required for msb/acq create-time port
#     publishing to reach the guest service; the host side remains loopback-only.
#   - Authentication is disabled with OD_DISABLE_API_AUTH=1. The sandbox boundary
#     and host-loopback port are the control, matching the approved posture for
#     this kit and the sibling paseo/openchamber UI kits.
#   - OD_DATA_DIR lives on a persistent kit volume. BYOK/model credentials should
#     continue to flow through acq + usai-provider + OpenCode, not through files in
#     this kit.
schemaVersion: "hybrid/v1"
kind: mixin
name: opendesign
displayName: OpenDesign (headless browser design workspace)
description: >
  Runs OpenDesign headlessly inside the sandbox as a browser-accessible local
  design workspace. Installs a pinned OpenDesign source checkout with a
  kit-managed Node 24 runtime, publishes the OpenDesign daemon/UI on port 7456,
  persists OpenDesign state on a kit volume, and seeds OpenDesign to use the
  existing OpenCode CLI. Opt-in mixin; designed to compose with usai-provider
  for model access and BYOK credential injection.

caps:
  network:
    allow:
      # OpenDesign source checkout and release metadata.
      - github.com:443
      - codeload.github.com:443
      - objects.githubusercontent.com:443
      - release-assets.githubusercontent.com:443
      # Node 24 tarball + checksum list.
      - nodejs.org:443
      # pnpm/npm package metadata and tarballs. Avoid leading-* wildcard entries:
      # neutral->backend translation may emit YAML that treats them as aliases.
      - registry.npmjs.org:443

files:
  - path: /home/agent/opendesign-install.sh
    mode: "0755"
    source: files/home/opendesign-install.sh
    description: Install/update pinned OpenDesign source checkout and kit-managed Node 24 runtime
  - path: /home/agent/opendesign-start.sh
    mode: "0755"
    source: files/home/opendesign-start.sh
    description: Install first boot, seed OpenDesign app config, and supervise the daemon/UI

commands:
  - phase: startup
    user: "0"
    background: false
    description: Ensure OpenDesign persistent volume is writable by the agent user
    command:
      - sh
      - -c
      - |
        mkdir -p /home/agent/.local/share/opendesign /home/agent/.local/state/opendesign
        chown 1000:1000 /home/agent/.local/share/opendesign /home/agent/.local/state/opendesign
  - phase: startup
    user: "1000"
    background: true
    description: Install/update OpenDesign and supervise the headless daemon/UI (background)
    command:
      - sh
      - -c
      - |
        OPENDESIGN_REF="open-design-v0.24.0" \
        OPENDESIGN_COMMIT="0d3a14c1df6dc5017f3cc3ef05b24558250c220b" \
        OPENDESIGN_NODE_VERSION="24.21.0" \
        OPENDESIGN_PNPM_VERSION="10.33.2" \
          sh /home/agent/opendesign-start.sh &

publishedPorts:
  - guest: 7456
    protocol: tcp
    name: opendesign

volumes:
  - path: /home/agent/.local/share/opendesign
    size: "10G"

environment:
  OD_BIND_HOST: "0.0.0.0"
  OD_PORT: "7456"
  OD_WEB_PORT: "7456"
  OD_DATA_DIR: "/home/agent/.local/share/opendesign/data"
  OD_DISABLE_API_AUTH: "1"
  OD_SANDBOX_MODE: "1"

agentContext: |
  ## OpenDesign (headless browser design workspace)

  This sandbox runs **OpenDesign** in the background on container port **7456**.
  OpenDesign is a browser UI and local daemon for design work; it launches
  existing agent CLIs from the sandbox, including OpenCode. The kit does not
  install OpenCode and does not store model-provider credentials.

  **Open it from the host.** The kit publishes container port 7456. Find the
  mapped host-loopback port and open the browser:

  ```
  acq ports <sandbox>
  # OpenDesign UI: open http://localhost:<host-port-for-7456>
  ```

  **Model credentials.** Pair this kit with `usai-provider` for the GSA default
  path. `usai-provider` configures OpenCode to use USAi, and `acq` injects
  `USAI_API_KEY` at runtime. Do not paste provider keys into chat. If you choose
  to configure extra OpenDesign media providers through the UI, those settings
  are stored under the persistent OpenDesign data directory.

  **Default agent.** Startup seeds OpenDesign's app config to select OpenCode,
  complete onboarding, and disable local telemetry when no user choice exists. It
  deliberately does NOT seed a default model; OpenCode/OpenDesign should use
  their configured defaults.

  **Auth.** The OpenDesign daemon runs with `OD_DISABLE_API_AUTH=1`. The sandbox
  is the security boundary and the host port is loopback-only. Run this only on a
  trusted, single-user host and do not forward the mapped port.

  Logs: `~/.local/state/opendesign/opendesign-daemon.log` and
  `~/.local/state/opendesign/opendesign-install.log`.

# No backend_shortcuts / backend_extras: the port, volume, files, env, and
# background startup are declared with the neutral hybrid/v1 vocabulary and are
# translated by acq for the active backend.
