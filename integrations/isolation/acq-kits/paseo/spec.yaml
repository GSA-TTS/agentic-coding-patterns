# spec.yaml — paseo (a neutral acq mixin kit, hybrid/v1)
#
# Self-hosts the Paseo daemon + bundled web UI (https://github.com/getpaseo/paseo)
# inside the sandbox and publishes it to the host. Paseo is a browser/mobile/CLI
# front-end that orchestrates coding-agent CLIs (Claude Code, Codex, Copilot,
# OpenCode, Pi). This kit runs ONLY the self-hosted web UI in the sandbox; the
# native desktop/mobile apps are out of scope. It is OPT-IN: not a default GSA
# kit. Apply it with an extra kit ref (see README.md "Quick start").
#
# NEUTRAL (backend-agnostic) hybrid/v1 form, structured like the sibling
# `openchamber` kit. acq's kit-translate layer maps the declarative
# caps/files/commands/publishedPorts/environment below onto whichever isolation
# backend acq has active — this kit is written entirely in the neutral vocabulary
# and carries no backend-specific config.
#
# DESIGN (see docs/decisions/):
#   - The STARTUP script (paseo-start.sh) owns the daemon: on every sandbox start
#     it installs/updates the pinned Paseo CLI and supervises the daemon with
#     `paseo daemon start --foreground --listen 0.0.0.0:6767 --web-ui`. A single
#     Paseo process serves the daemon API, the WebSocket, AND the bundled web UI,
#     all on ONE container port (6767). Because a `startup` command fires on EVERY
#     start — including a detached `acq create` with nobody attached, held open by
#     the sandbox's tini keepalive (PID 1) — the daemon + UI come up on their own.
#     There is deliberately NO install phase (see the install note below).
#   - The sandbox entrypoint runs the bare command `opencode`. This kit drops a
#     THIN, agent-named WRAPPER at ~/.local/bin/opencode, which is first on the
#     image PATH (ahead of the npm-global bin where the real opencode lives), so
#     the wrapper is what the entrypoint runs on the interactive `acq run` path.
#     With arguments it passes straight through to the real opencode (so opencode
#     still works normally — including as a Paseo provider CLI that Paseo spawns).
#     With NO arguments it execs the GENERIC shim (/home/agent/paseo-agent-shim),
#     which does all the kit work: (1) pin Paseo's worktree root to the current
#     project (see WORKTREES below), (2) print host-connect instructions, and (3) —
#     only when it is PID 1 (the `acq run` entrypoint) — hold the foreground so
#     THAT session's sandbox stays open. The wrapper `exec`s the shim so the shim
#     inherits its process id (PID 1 on the entrypoint path). Only the thin wrapper
#     is agent-specific; the shim knows nothing about opencode, so the kit is
#     reusable with other agents by dropping another thin wrapper next to it.
#
# NO SHARED SESSION (unlike openchamber): Paseo is NOT an opencode server — it
# launches its own agent CLIs (opencode among them) as child processes. There is
# therefore no shared live session between the terminal OpenCode TUI and Paseo,
# and no separate "raw server" port to attach a TUI to. This is accepted. The kit
# keeps the same PID-1-hold semantics for the wrapper so `acq run` keeps the
# sandbox (and thus the daemon/UI) alive; that is the only opencode-shaped
# behavior retained.
#
# WHY THE ENTRYPOINT MUST NOT RETURN on `acq run`: a Docker sandbox is
# "running" only while its entrypoint / PID 1 is alive. On the interactive
# `acq run` path the wrapper IS the entrypoint (via PATH-shadowing) and execs the
# shim, so the shim becomes PID 1; a no-arg path that returns would let PID 1 exit
# and flip the sandbox running -> stopped. The shim therefore ends the no-arg path
# by BLOCKING forever (hold_pid1) when it is PID 1. On the detached `acq create`
# path PID 1 is instead a tini keepalive shim and the wrapper is not the
# entrypoint, so nothing here is needed to keep a detached sandbox alive. See
# docs/decisions/paseo-mixin-generic-wrapper.md.
#
# WORKTREES: Paseo keeps agent worktrees under a SINGLE GLOBAL root
# (worktrees.root in $PASEO_HOME/config.json), laid out <root>/<projectHash>/<slug>.
# There is no per-project root, so keeping worktrees inside EACH project dir is
# not natively possible. The approved fallback is to point the one global root at
# a subdir of the FIRST mounted project dir (the working dir when the entrypoint
# runs). The daemon reads worktrees.root ONCE at boot (no SIGHUP / no runtime
# reread — verified against the Paseo source), so the shim — which runs in the
# primary-workspace cwd on `acq run` — writes worktrees.root = <PWD>/.paseo-worktrees
# into config.json and BOUNCES the daemon (kills the supervised child; the
# supervisor respawns it and re-reads config). The supervisor starts the daemon
# immediately with Paseo's default root; the shim rewrites + restarts only when
# the value actually changes. See docs/decisions/worktrees-root-global-only.md and
# supervisor-owns-daemon-wrapper-pins-worktrees.md.
#
# PROJECT PRE-POPULATION: at startup (after the daemon answers /api/health) the
# supervisor script runs paseo-register-mounts.mjs, which registers EACH
# read-write host project directory mounted into the sandbox with the daemon, so
# the web UI pre-lists every mounted repo — not just the primary one the `acq run`
# entrypoint opens. It talks to the daemon through the CLI's own client
# (`client.addProject`, the only side-effect-free registration path — there is no
# `paseo project add` verb), which is idempotent (dedups by root path). The set of
# directories is derived from /proc/mounts in a BACKEND-AGNOSTIC way that does NOT
# rely on the mount SOURCE name (a per-path hash on msb, the literal "host" on sbx
# — neither is a stable key): a mount qualifies when it is fstype virtiofs, mounted
# read-write (read-only mounts are SKIPPED), its target is an existing directory
# (excludes sbx's /etc/{resolv.conf,hosts} bind files), the target is not under a
# system prefix (/etc /run /proc /sys /dev or "/"), and the target basename does
# not start with "." (skips the backend runtime dir — /.msb today, any future
# /.<backend> by convention). The helper is fully fail-open: it never exits
# non-zero, so a transient daemon/connection error just means fewer projects until
# the next start. See docs/decisions/prepopulate-projects-from-mounts.md.
#
# Why install at STARTUP, not an install phase: the Paseo CLI is a plain npm
# package (@getpaseo/cli, which pulls @getpaseo/server whose tarball BUNDLES the
# web UI). Its only native dep (sherpa-onnx-node, for voice) resolves via
# platform PREBUILT optionalDependencies with no build scripts, so it installs on
# the opencode base image (no C toolchain) from the npm registry. Installing at
# startup keeps any transient npm failure OFF the create path (it degrades to "UI
# unavailable", never a dead sandbox) and is where the egress proxy + its CA are
# fully usable. See docs/decisions/install-at-startup.md.
#
# AUTH: the daemon runs UNSECURED (no PASEO_PASSWORD). The sandbox — an ephemeral
# container with proxied, allow-listed egress and no host FS — is the security
# boundary, and the published host port is host loopback only. See the README
# "Security note".
#
# PORT FORWARDING: the daemon binds container port 6767 (API + WS + web UI); it is
# published to the host via the NEUTRAL top-level `publishedPorts:` list. acq's
# translator/adapter maps it to the active backend's native port-publish
# primitive, so the kit needs no per-backend extras.
schemaVersion: "hybrid/v1"
kind: mixin
name: paseo
displayName: Paseo (self-hosted web UI for coding agents)
description: >
  Runs the Paseo daemon and its bundled browser web UI inside the sandbox and
  publishes it to the host. Installs or updates the pinned Paseo CLI and supervises
  the daemon on 0.0.0.0:6767 (API + WebSocket + web UI on one port). Ships a thin
  `opencode` wrapper over a generic kit shim that pins Paseo's worktree root under
  the current project and holds PID 1 on `acq run` so the sandbox (and UI) stay up.
  Opt-in mixin; composes with the USAi provider and the other GSA kits.

caps:
  network:
    allow:
      # npm downloads @getpaseo/cli, @getpaseo/server (which bundles the web UI),
      # and the sherpa-onnx-node platform prebuilt from the npm registry. Both
      # metadata and tarballs are served from registry.npmjs.org (npm's
      # dist.tarball URLs point at this host), so no wildcard subdomain is needed.
      # NOTE: do NOT use a leading-`*` host here (e.g. "*.npmjs.org") — acq's
      # kit translation emits allow entries UNQUOTED, and a bare `- *.npmjs.org`
      # is parsed by YAML as an alias, breaking the translated spec ("did not
      # find expected alphabetic or numeric character").
      - registry.npmjs.org

files:
  # The `opencode` wrapper. Dropped at ~/.local/bin/opencode, which is FIRST on
  # the image PATH, so it shadows the real opencode and is what the sandbox
  # entrypoint (bare `opencode`) runs. It is a THIN, agent-named shell: passthrough
  # to the real opencode with args, else exec the generic shim. See the header
  # DESIGN note.
  - path: /home/agent/.local/bin/opencode
    mode: "0755"
    source: files/home/.local/bin/opencode
    description: Thin agent-named wrapper — passthrough to the real opencode, else exec the generic kit shim
  - path: /home/agent/paseo-agent-shim
    mode: "0755"
    source: files/home/paseo-agent-shim
    description: Generic, agent-neutral kit logic — pins Paseo worktree root, prints connect info, holds PID 1 on `acq run`
  - path: /home/agent/paseo-start.sh
    mode: "0755"
    source: files/home/paseo-start.sh
    description: Install/update the pinned Paseo CLI and supervise the Paseo daemon + web UI
  - path: /home/agent/paseo-set-worktrees-root.mjs
    mode: "0755"
    source: files/home/paseo-set-worktrees-root.mjs
    description: Idempotently merge worktrees.root into $PASEO_HOME/config.json (used by the shim)
  - path: /home/agent/paseo-register-mounts.mjs
    mode: "0755"
    source: files/home/paseo-register-mounts.mjs
    description: Pre-populate Paseo projects from the read-write host directories mounted into the sandbox (run at startup, fail-open, idempotent)

commands:
  # Run the startup script as the agent user at every start. The never-exiting
  # supervisor loop (the daemon) must not block sandbox start, so this command is
  # marked neutral `background: true` — acq's kit translation maps that to the
  # active backend's native detached hook. The Paseo CLI version pin is exported
  # here (the script also carries a matching fallback default); bump BOTH together
  # to adopt a newer release. See docs/decisions/.
  #
  # TRAILING `&` DECISION (kept, same rationale as openchamber): the `sh -c` body
  # ALSO ends the script launch with a trailing `&`, as belt-and-suspenders.
  # `background: true` tells the backend to run the WHOLE command detached; the
  # inner `&` returns the `sh -c` immediately having spawned the script. The two
  # mechanisms compose safely and match the shape that works for openchamber.
  - phase: startup
    # Schema-required: the hybrid/v1 `user` field pattern is ^[0-9]+$ (a numeric
    # uid, NOT a name), so this MUST stay "1000" even though the agent uid is
    # assigned at provision and is not necessarily 1000. Do not "fix" this to
    # `agent`; acq/the backend runs the startup phase as the agent user.
    user: "1000"
    background: true
    description: Install/update the pinned Paseo CLI and supervise the Paseo daemon + web UI (background)
    command:
      - sh
      - -c
      - |
        PASEO_CLI_VERSION="0.6.1" \
          sh /home/agent/paseo-start.sh &

# Neutral published port (schema hybrid/v1). Publish the single container/guest
# port the daemon binds: 6767 (API + WebSocket + web UI). Uses the NEUTRAL shape —
# `guest:`, `protocol:`, `name:`. Host is omitted, so acq defaults the host port to
# the guest value (or an ephemeral host loopback port). acq's kit translation maps
# this to the active backend's native port-publish primitive, so the port is
# published at create time.
publishedPorts:
  - guest: 6767
    protocol: tcp
    name: paseo

# Non-secret guest env. PASEO_WEB_UI_ENABLED enables the bundled UI (equivalent to
# the daemon's --web-ui flag; both are set, harmlessly). PASEO_LISTEN fixes the
# bind address/port. ONNXRUNTIME_NODE_INSTALL=skip mirrors Paseo's own Docker
# image and keeps the voice dep's install from attempting an onnxruntime fetch.
# No secret goes here (PASEO_PASSWORD is intentionally unset — unsecured; see
# AUTH note above).
#
# IN-GUEST BIND IS 0.0.0.0:6767 (all guest interfaces). A loopback-only bind
# (127.0.0.1:6767) is a defense-in-depth win in the abstract, but it is NOT
# reachable through acq's CREATE-TIME port publish on the msb backend: msb's
# `-p HOST:GUEST` (which acq emits from the neutral publishedPorts below) binds a
# HOST loopback listener but the publisher dials the sandbox's GUEST NETWORK IP
# for GUEST — it does not connect to guest 127.0.0.1. So a 127.0.0.1-only daemon
# answers `acq exec <sbx> -- curl http://127.0.0.1:6767` from inside the guest
# yet the published host port returns "Empty reply from server" (browser
# ERR_EMPTY_RESPONSE). Binding 0.0.0.0 makes the guest port reachable from the
# host-published loopback port. The sandbox remains the security boundary
# (ephemeral container, proxied allow-listed egress, no host FS) and the HOST
# side of the publish is still loopback-only, so 0.0.0.0 in-guest does not widen
# host exposure. This is the same msb create-time port-publish limitation covered
# by quickstart's BACKEND_GUIDE.md / KNOWN_FAILURE_MODES.md guidance.
# Verified live: see scripts/verify "in-guest bind" assertion.
#
# PASEO_RELAY_ENABLED=false disables Paseo's cloud relay (wss://relay.paseo.sh).
# The daemon defaults relay to ON and, absent this, dials the relay on a ~30s
# retry loop forever. The relay host is NOT on this kit's egress allow-list (only
# registry.npmjs.org is), so the sandbox proxy resets the TLS handshake and the
# daemon logs an endless stream of `relay_error` / `relay_control_disconnected`
# (ECONNRESET). The relay is unnecessary here — the host reaches the web UI over
# the loopback-published port (see publishedPorts + README "Reaching it from the
# host"), not through Paseo's cloud relay. The env var is read at daemon config
# load (server/config.js) and takes precedence over persisted config, so it holds
# across daemon restarts/self-updates without editing config.json.
environment:
  PASEO_WEB_UI_ENABLED: "true"
  PASEO_LISTEN: "0.0.0.0:6767"
  PASEO_RELAY_ENABLED: "false"
  ONNXRUNTIME_NODE_INSTALL: "skip"

agentContext: |
  ## Paseo (self-hosted web UI for coding agents)

  This sandbox runs the **Paseo daemon** and its **bundled web UI** in the
  background on container port **6767** (one port serves the daemon API, the
  WebSocket, and the browser UI). **It is started and supervised by the kit's
  startup script on every sandbox start** — including a detached `acq create`
  with nobody attached — so it comes up on its own.

  **No terminal needed to bring it up.** A single
  `acq create --name <sandbox> opencode <path>` starts the daemon + UI; then find
  the host port with `acq ports <sandbox>` and open the browser. The `opencode`
  **wrapper** (at `~/.local/bin/opencode`, first on PATH) is a thin shim over
  generic kit logic: running it with **no arguments** pins Paseo's worktree root
  under your project and prints host-connect instructions (and, on the `acq run`
  path, holds the session open so the sandbox stays running). Running
  `opencode <args…>` (e.g. `opencode run …`, `opencode auth login`) passes
  straight through to the real opencode — so opencode still works as one of
  Paseo's provider CLIs.

  **Reaching it from the host.** The kit publishes container port 6767; acq's
  active backend maps it to an ephemeral host loopback port, per sandbox. Find it
  and open the browser:

  ```
  acq ports <sandbox>        # host port for 6767
  # Paseo web UI:  open http://localhost:<host-port-for-6767>
  ```

  Prefer the `localhost` hostname over `127.0.0.1`: the daemon self-advertises as
  a local host over the same origin (no relay), and the UI keys that host on
  `localhost:<port>`, so a `127.0.0.1` address bar can show "no hosts" with a
  `ws://…/ws` reconnect loop. See TROUBLESHOOTING.md.

  **No shared session with a terminal TUI.** Unlike a shared-server setup, Paseo
  launches its own agent CLIs as child processes; the terminal OpenCode TUI and
  Paseo do NOT share one live session. Use the browser UI to drive agents through
  Paseo.

  **Worktrees.** Paseo keeps agent git worktrees under a single global root. This
  kit pins that root to `<your-project>/.paseo-worktrees` (a subdir of the first
  mounted project directory) when you run the `opencode` wrapper — it rewrites
  `$PASEO_HOME/config.json` and restarts the daemon so the change takes effect.
  Before you run the wrapper once, worktrees default to `$PASEO_HOME/worktrees`.

  **Projects.** Every read-write host directory mounted into the sandbox is
  registered as a Paseo project at startup, so the web UI pre-lists your repos
  with no manual "Add project". Read-only mounts are skipped. This runs on every
  start (idempotent) and is fail-open. Registrar log:
  `~/.local/state/paseo/paseo-register.log`.

  **Auth.** The daemon runs **unsecured** (no `PASEO_PASSWORD`): the sandbox is
  the security boundary and the published port is host loopback only.

  Logs: `~/.local/state/paseo/paseo-daemon.log`. The daemon runs under a respawn
  loop (`supervisor:paseo-daemon`), so if it exits — for example after the shim
  bounces it to apply a new worktree root, or after a self-update — it
  comes back a few seconds later on its own; the log shows
  `[supervisor] ... restarting` lines when it happens.

# No backend_extras / backend_shortcuts: the port and background flag are declared
# with the NEUTRAL publishedPorts + background vocabulary above, which acq's kit
# translation feeds to whatever backend it has active. The install+supervise
# script, the thin wrapper, and the generic shim are backend-agnostic.
