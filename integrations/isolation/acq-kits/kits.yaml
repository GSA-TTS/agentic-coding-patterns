# acq-kits registry — human-readable parity summary.
#
# Maps each neutral (schemaVersion: "hybrid/v1") kit to the backends that
# support it and a prose parity note describing any per-backend capability
# difference. `acq` abstracts the isolation backend; the authoritative backend
# set lives in the acq wrapper, not here. Parity is ADVISORY (documented, not
# machine-enforced) — the source of truth for a per-backend difference is the
# kit's spec.yaml backend_shortcuts and its README parity note.
#
# See integrations/isolation/docs/decisions/0001-neutral-hybrid-v1-acq-kits.md.
schemaVersion: "acq-kits-registry/v1"

kits:
  usai-provider:
    backends: [sbx, msb]
    parity: |
      Both backends allow-list api.gsa.usai.gov, drop the USAi opencode.jsonc +
      merge script, and run the startup merge into OpenCode's global config. No
      backend shortcut. The USAi API key is injected at runtime by acq via the
      active backend's credential path (never stored in the kit).

  agentic-coding-playbook:
    backends: [sbx, msb]
    parity: |
      Both backends allow-list github.com / codeload.github.com and run the same
      clone+link script (files/home/playbook-clone.sh) at sandbox startup, with
      the PLAYBOOK_SHA integrity gate. No backend shortcut. The GitHub token
      (while the playbook repo is private) is injected per-backend by acq.

  zscaler-ca-certificate:
    backends: [sbx, msb]
    parity: |
      msb uses the native --trust-host-cas shortcut (host-trusted CAs imported
      into the guest at boot); sbx (and ppp later) use the file-drop +
      update-ca-certificates mechanism. Behavioral parity: the guest ends up
      trusting the Zscaler CA either way.

  git-ssh-sign:
    backends: [sbx, msb]
    parity: |
      `acq` forwards the host SSH agent into the sandbox on both backends
      whenever the host SSH_AUTH_SOCK is set (the per-backend plumbing is acq's
      concern, not the kit's). The signing key is resolved at signing time; no
      key material is written at create. No backend shortcut — SSH-agent
      forwarding is the shared mechanism.

  openchamber:
    backends: [sbx, msb]
    parity: |
      Opt-in browser UI for OpenCode plus an `opencode` wrapper that owns a
      single shared OpenCode server (see docs/decisions/). Declares BOTH sbx and
      msb via the neutral vocabulary: the two published container ports (3000 for
      OpenChamber, 4096 for the shared server) are expressed with the neutral
      top-level `publishedPorts` list, and the never-exiting startup supervisor is
      marked with the neutral `background: true` flag (both added to the hybrid/v1
      schema in #276). acq's translator/adapter maps publishedPorts + background to
      each backend's native port-publish and detached-hook primitives, so the
      ports are published and the supervisor is detached at create time on both
      backends with no manual step. The install+supervise script
      (files/home/openchamber-start.sh) and the wrapper
      (files/home/.local/bin/opencode) are backend-agnostic. No backend shortcut.

  paseo:
    backends: [sbx, msb]
    parity: |
      Opt-in self-hosted browser web UI for coding agents (Paseo). Written
      entirely in the neutral vocabulary with no backend shortcut or extras: the
      single published container port (6767, serving the daemon API + WebSocket +
      bundled web UI) is expressed with the neutral top-level `publishedPorts`
      list, and the never-exiting startup supervisor is marked with the neutral
      `background: true` flag. acq's kit translation maps publishedPorts +
      background to the active backend's native port-publish and detached-hook
      primitives, so the port is published and the supervisor is detached at
      create time with no manual step. The install+supervise script
      (files/home/paseo-start.sh), the worktree-root helper
      (files/home/paseo-set-worktrees-root.mjs), the generic kit shim
      (files/home/paseo-agent-shim), and the thin agent-named `opencode` wrapper
      (files/home/.local/bin/opencode) are backend-agnostic. Unlike openchamber
      there is NO shared TUI session (Paseo launches its own agent CLIs) and only
      ONE port. The daemon runs unsecured (no PASEO_PASSWORD); the sandbox is the
      security boundary and the port is host loopback only.

  prime-agent:
    backends: [sbx, msb]
    parity: |
      Opt-in mixin that installs PrimeIntellect-ai/prime-agent (MIT), a terminal
      AI coding assistant with an embedded IPython tool. Written entirely in the
      neutral vocabulary with no backend shortcut or extras: an install-phase
      script (files/home/prime-agent-install.sh) installs the CLI at create time,
      and two startup-phase scripts drop the USAi model catalog
      (files/home/prime-agent-install-models-json.sh) and bootstrap the IPython
      kernel (files/home/prime-agent-bootstrap-kernel.sh). Publishes NO ports
      (prime-agent is a TUI, not a web UI) — unlike openchamber/paseo. SKELETON
      only: the three scripts are placeholders; the real install/CA-bundle/
      kernel logic and the generated model catalog
      (files/home/prime-agent-config/models.json) land in follow-up work tracked
      in the patterns repo's prime-agent epic. Model-provider egress is the
      usai-provider kit's job, not this one.

  pi-coding-agent:
    backends: [sbx, msb]
    parity: |
      Opt-in mixin that installs earendil-works/pi (MIT), npm package
      @earendil-works/pi-coding-agent — a plain terminal AI coding agent that
      grants the model only read/write/edit/bash tools by default (no built-in
      MCP, sub-agents, permission popups, or plan mode). Written entirely in the
      neutral vocabulary with no backend shortcut or extras: a single
      startup-phase script (files/home/pi-coding-agent-install.sh) installs the
      CLI via the standard npm registry path (npm install -g --ignore-scripts,
      pinned version, unprivileged per-user npm prefix, no pi.dev egress).
      Publishes NO ports (a TUI, not a web UI) — like prime-agent, unlike
      openchamber/paseo. No install phase — unlike prime-agent's still-in-flight
      skeleton, this kit is startup-only throughout, matching openchamber's
      settled pattern; shipped ahead of prime-agent to validate that pattern on
      a materially simpler target with no native-module or Python-kernel
      bootstrap step. Model-provider config (USAi models.json) is deliberately
      deferred — no emitter exists yet to populate it — and will land in a
      follow-up alongside a real pi USAi-catalog emitter. Model-provider egress
      is the usai-provider kit's job, not this one.
