# spec.yaml — openchamber (an sbx mixin kit)
#
# Runs OpenChamber, a web UI for OpenCode, inside the sandbox and points it at a
# managed OpenCode server. Applying this kit gives you a browser-based OpenCode
# in addition to the terminal TUI you get from `acq run opencode` / `sbx run
# opencode`. It is OPT-IN: it is not one of the default GSA kits. Apply it with
# an extra --kit ref (see README.md "Usage").
#
# Design:
#   - caps.network: allow egress to the OpenChamber install sources (npm registry,
#     the install-script host, and the GitHub release-asset hosts the prebuilt
#     better-sqlite3 binary comes from). Default-deny otherwise. The install
#     script is fetched from a PINNED tag and SHA-256-verified before it runs
#     (see environment.variables + the install note below).
#   - commands.startup (agent uid 1000, background): a single INLINE `sh -c`
#     script that (a) installs OpenChamber on first boot, then (b) starts a
#     headless `opencode serve` on 127.0.0.1:4096 and OpenChamber bound to
#     0.0.0.0, pointed at that server via OPENCODE_SKIP_START + OPENCODE_PORT.
#     Both are wrapped in a tiny respawn loop so that if either process exits
#     (e.g. an interactive self-update, which needs a restart to take effect, or
#     a crash) it is restarted after a few seconds — no systemd.
#     Idempotent: no-ops if a supervisor for each service is already running.
#     There is deliberately NO commands.install — see the install note below.
#
# Why inline (not a static file / initFiles): sbx's create-time static-file write
# hook mishandles shell-metacharacter-heavy content (quotes, $(...), line
# continuations) and crashes container start (docker/sbx-releases #118).
# commands.initFiles.content is no help either — its validator rejects any
# placeholder except ${WORKDIR}, and the script needs literal ${VAR} expansions.
# Inlining into commands.startup sidesteps both: startup runs through a normal
# exec, not the file-write hook, and carries no placeholder rules.
#
# Why install at STARTUP, not commands.install: @openchamber/web depends on
# better-sqlite3, a native module whose npm install runs
# `prebuild-install || node-gyp rebuild` — it downloads a prebuilt binary and
# only compiles from source if that fails. The opencode base image has no C
# toolchain, so a failed download means the compile fails too; as a CREATE-TIME
# install hook that non-zero exit crashes `sbx create` with a 500. Installing at
# startup keeps it OFF the create path (a failure degrades to "UI unavailable",
# never a dead sandbox) and is where the proxy + its CA are fully usable.
#
# AUTH: `opencode serve` requires HTTP Basic auth (unauthenticated requests get
# 401). The script generates a per-sandbox password once (stored at
# ~/.local/state/openchamber/opencode-server-password, mode 600) and exports it
# as OPENCODE_SERVER_PASSWORD for both `opencode serve` and OpenChamber, so they
# share one credential. A bridge TUI must pass the same password (see
# agentContext). The password is a sandbox-local secret, not host key material.
#
# SESSION NOTE (documented for users in agentContext + README): the TUI you get
# from `sbx run opencode` runs its OWN in-process OpenCode server, so it does NOT
# share live session state with the OpenChamber browser (which uses the managed
# server on :4096). To drive the SAME server from a terminal, attach to it with
# the per-sandbox password (see agentContext).
#
# PORT FORWARDING: publishedPorts (below) declares the in-container port so sbx
# maps it to an EPHEMERAL host port on 127.0.0.1, allocated PER SANDBOX — so
# multiple sandboxes running this kit each get a distinct host port and never
# collide. `sbx ports <sandbox>` (or `acq ports`) lists the assigned host port;
# `sbx ports <sandbox> --publish 3000:3000` pins a chosen one. publishedPorts is
# an IMMUTABLE create-time setting: `sbx kit add` skips it, so the kit must be
# applied at create time (--kit) for the port mapping to take effect. A kit
# cannot pick the host port itself (two kits wanting the same one would collide
# on the user's machine). See README.md.
schemaVersion: "2"
kind: mixin
name: openchamber
displayName: OpenChamber (web UI for OpenCode)
description: >
  Runs OpenChamber, a browser UI for OpenCode, inside the sandbox alongside the
  terminal TUI. Installs the OpenChamber CLI, starts a managed OpenCode server
  on 127.0.0.1:4096, and serves OpenChamber on 0.0.0.0:3000. Declares the port
  so sbx maps it to an ephemeral host port (see `sbx ports`). Opt-in mixin;
  composes with the USAi provider and the other GSA kits. The browser and the
  default TUI do not share live session state — attach a terminal to the managed
  server to share (see agentContext).

# In-container port sbx maps to an ephemeral host port at sandbox start. This is
# the v2 top-level `publishedPorts` field (v1 nested it under `network:`).
# Immutable at create time: applying this kit with `sbx kit add` skips the port
# mapping — apply it at create time with `--kit`.
publishedPorts:
  - container: 3000
    protocol: tcp
    name: openchamber

caps:
  network:
    allow:
      # 1. The install script is fetched from GitHub raw (at startup, first boot),
      #    from a PINNED tag — not `main` (see OPENCHAMBER_REF/SHA below).
      - raw.githubusercontent.com
      # 2. npm downloads @openchamber/web and its deps from the npm registry.
      - registry.npmjs.org
      - "*.npmjs.org"
      # 3. @openchamber/web depends on better-sqlite3, a native module whose
      #    install downloads a PREBUILT binary from GitHub release assets (and only
      #    compiles from source if that download is blocked — which fails here, no
      #    toolchain). Allow the release-asset hosts so it always uses the prebuilt.
      - github.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com

environment:
  variables:
    # Pinned OpenChamber release: a human-legible tag (OPENCHAMBER_REF) plus the
    # SHA-256 of the install.sh served at that tag (OPENCHAMBER_INSTALL_SHA256,
    # an integrity pin). The startup script fetches install.sh from
    # raw.githubusercontent.com at this TAG — NOT `main` — and verifies the
    # fetched script's SHA-256 equals OPENCHAMBER_INSTALL_SHA256 before piping it
    # to a shell; on mismatch it refuses to run it. Bump BOTH together to adopt a
    # newer release, keeping them in sync with the fallback defaults in the
    # startup script.
    #
    # Why pin (per the sibling playbook-kit's SHA-pin rationale): the whole kit
    # model is SHA-pinning. Fetching an installer from `main` on EVERY boot means
    # a compromised or accidentally-broken upstream `main` runs with the agent's
    # full sandbox capabilities at every start. A tag is a MUTABLE ref, and the
    # sibling CA kit has the sandbox trusting an inspecting proxy on the fetch
    # path, so tag immutability alone is not sufficient — hence the content-hash
    # check. (Content SHA-256, not a git commit SHA: the script is fetched as a
    # raw file, so verifying the bytes we actually pipe to bash is the pin that
    # matters. Re-pin the hash when bumping OPENCHAMBER_REF; the value below is
    # `curl -fsSL <raw-url>@<ref> | sha256sum`.)
    OPENCHAMBER_REF: "v1.9.10"
    OPENCHAMBER_INSTALL_SHA256: "aa268c96ddc6d7d53fc54d2e5c2312e689493ecef6ba4f69730a93d50cf33287"

commands:
  # Install + run entirely from commands.startup (there is NO commands.install).
  #
  # Why not commands.install: @openchamber/web depends on better-sqlite3, a NATIVE
  # module whose npm install runs `prebuild-install || node-gyp rebuild` — it
  # downloads a prebuilt binary and only compiles from source if that download
  # fails. The opencode base image has no C toolchain (`cc`/`make`), so a failed
  # download means the source fallback fails too; as a CREATE-TIME install hook
  # that non-zero exit crashes `sbx create` with a 500. Verified empirically:
  # the identical install that fails at create-time succeeds at startup, because
  # the sandbox's egress proxy + its CA are only fully wired for the running
  # container. So we install at startup instead — off the create path, where a
  # failure degrades to "UI unavailable" rather than a dead sandbox.
  #
  # Making the prebuilt download succeed at startup needs two things (both below):
  #   1. PROXY: all egress goes through the sandbox proxy. npm honors HTTP(S)_PROXY
  #      automatically, but prebuild-install (simple-get/tunnel-agent) only
  #      proxies when told via npm config — so export npm_config_*_proxy.
  #   2. TLS: the proxy presents a TLS chain signed by its own CA, which Node
  #      doesn't trust by default → "unable to get local issuer certificate" →
  #      download fails → source-build fallback. The sandbox exposes that CA as
  #      PROXY_CA_CERT_B64; decode it and point Node at it via NODE_EXTRA_CA_CERTS.
  #      (This is the sbx egress-proxy CA — sufficient from inside the sandbox
  #      regardless of any outer Zscaler/HTTPS inspection, which terminates
  #      outside the sandbox boundary.)
  #
  # The startup step runs as the agent user (uid 1000) in the background on every
  # sandbox start and is fully idempotent: it installs OpenChamber only if
  # missing, then starts a managed `opencode serve` and OpenChamber only if not
  # already answering. `|| true` on the install keeps a hiccup from stopping the
  # rest of startup.
  startup:
    - command:
        - sh
        - -c
        - |
          set -eu
          OC_PORT=4096
          CHAMBER_PORT="${OPENCHAMBER_PORT:-3000}"

          # npm global installs land in this prefix's bin, which is NOT on the
          # startup shell's PATH by default — the installer even warns about it.
          # Put it on PATH up front so a freshly-installed `openchamber` resolves
          # in THIS shell (otherwise the post-install `command -v openchamber`
          # guard trips and the server section never runs on first boot).
          NPM_BIN="$(npm prefix -g 2>/dev/null)/bin"
          case ":$PATH:" in *":$NPM_BIN:"*) : ;; *) PATH="$NPM_BIN:$PATH" ;; esac
          export PATH

          # --- Install OpenChamber if it isn't present yet (first boot). -------
          if ! command -v openchamber >/dev/null 2>&1; then
            # Route prebuild-install (and npm) through the sandbox proxy.
            [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ] && export npm_config_https_proxy="${HTTPS_PROXY:-$https_proxy}"
            [ -n "${HTTP_PROXY:-${http_proxy:-}}" ]  && export npm_config_proxy="${HTTP_PROXY:-$http_proxy}"
            # Build a CA bundle for Node-based downloads (the prebuilt native
            # binary). NODE_EXTRA_CA_CERTS *appends* to Node's built-in roots,
            # which lack both the sandbox proxy CA and any HTTPS-inspection CA
            # (e.g. Zscaler). Concatenate BOTH the sandbox proxy CA
            # (PROXY_CA_CERT_B64) and the system trust store (populated with the
            # inspection CA by the zscaler-ca-certificate kit at startup) so the
            # full chain validates — the proxy CA alone is not sufficient behind
            # an inspecting proxy.
            _ca="$HOME/.local/state/openchamber/ca-bundle.pem"
            mkdir -p "$(dirname "$_ca")"
            : > "$_ca"
            [ -n "${PROXY_CA_CERT_B64:-}" ] && printf %s "$PROXY_CA_CERT_B64" | base64 -d >> "$_ca" 2>/dev/null
            [ -f /etc/ssl/certs/ca-certificates.crt ] && cat /etc/ssl/certs/ca-certificates.crt >> "$_ca"
            [ -s "$_ca" ] && export NODE_EXTRA_CA_CERTS="$_ca"
            # Fetch install.sh from a PINNED TAG (never `main`) and verify its
            # SHA-256 before running it — the installer runs with the agent's
            # full sandbox caps, and the fetch path may be MITM-inspected, so a
            # tag alone is not enough. On mismatch, skip install (UI unavailable)
            # rather than pipe unverified bytes to bash.
            _ref="${OPENCHAMBER_REF:-v1.9.10}"
            _want_sha="${OPENCHAMBER_INSTALL_SHA256:-aa268c96ddc6d7d53fc54d2e5c2312e689493ecef6ba4f69730a93d50cf33287}"
            _installer="$HOME/.local/state/openchamber/install.sh"
            if curl -fsSL "https://raw.githubusercontent.com/openchamber/openchamber/$_ref/scripts/install.sh" \
                 -o "$_installer" 2>/tmp/openchamber-install.log; then
              _got_sha="$( (sha256sum "$_installer" 2>/dev/null || shasum -a 256 "$_installer" 2>/dev/null) | cut -d' ' -f1)"
              if [ "$_got_sha" = "$_want_sha" ]; then
                bash "$_installer" >>/tmp/openchamber-install.log 2>&1 || true
              else
                echo "openchamber: install.sh SHA-256 mismatch (got $_got_sha, want $_want_sha) at $_ref; refusing to run it" >>/tmp/openchamber-install.log 2>&1
              fi
              rm -f "$_installer"
            fi
          fi
          command -v openchamber >/dev/null 2>&1 || {
            echo "openchamber install failed; see /tmp/openchamber-install.log" >&2
            exit 0   # never fail the sandbox over an optional UI
          }

          # --- Managed opencode server + OpenChamber (idempotent). ------------
          # `opencode serve` REQUIRES HTTP Basic auth: unauthenticated requests
          # get 401. OpenChamber (skip-start mode) authenticates with Basic
          # opencode:$OPENCODE_SERVER_PASSWORD, so both share one password.
          # Generate a per-sandbox secret once and reuse it on every startup so
          # restarts keep matching a server started with the same password.
          PW_FILE="$HOME/.local/state/openchamber/opencode-server-password"
          mkdir -p "$(dirname "$PW_FILE")"
          if [ ! -s "$PW_FILE" ]; then
            ( openssl rand -hex 32 2>/dev/null \
              || head -c 32 /dev/urandom 2>/dev/null | od -An -tx1 | tr -d ' \n' \
              || printf '%s%s%s%s' "$$" "$RANDOM" "$RANDOM" "$(date +%s)" ) > "$PW_FILE"
            chmod 600 "$PW_FILE"
          fi
          OPENCODE_SERVER_PASSWORD="$(cat "$PW_FILE")"
          export OPENCODE_SERVER_PASSWORD

          # Both services are kept alive by a tiny supervisor loop: if the
          # process exits (e.g. OpenCode/OpenChamber does an interactive
          # self-update, which requires a restart to take effect, or just
          # crashes), wait a few seconds and start it again. No systemd — the
          # startup step is already background:true, so each supervisor loop
          # runs backgrounded here and lives for the container's lifetime.
          #
          # RESTART_DELAY: seconds to wait before respawning a stopped process.
          RESTART_DELAY="${OPENCHAMBER_RESTART_DELAY:-5}"

          # Guard against a second startup run (idempotent restarts) spawning a
          # duplicate supervisor: only start a supervisor if one isn't already
          # running for that service. Each loop is launched with a marker
          # ARGUMENT ("supervisor:<name>") that the inner `sh -c` ignores; pgrep
          # -f matches the whole command line, so it finds the loop by that
          # marker. (An argument, not `exec -a` — the startup shell is POSIX
          # `sh`/dash, which has no `exec -a`.) A single supervisor per service
          # means we never spawn a duplicate — the loop only relaunches after
          # the previous instance has actually exited.
          supervisor_running() { pgrep -u "$(id -u)" -f "supervisor:$1" >/dev/null 2>&1; }

          # Start the managed `opencode serve` supervisor unless already running.
          # No health probe is needed: the loop only respawns after serve
          # actually exits, so it can't start a duplicate against a live server.
          # argv to the inner sh -c: $0=marker, $1=RESTART_DELAY, $2=port.
          if ! supervisor_running opencode-serve; then
            ( sh -c '
                while :; do
                  echo "[supervisor] starting opencode serve at $(date -u +%FT%TZ)"
                  opencode serve --hostname 127.0.0.1 --port "$2" || true
                  echo "[supervisor] opencode serve exited; restarting in ${1}s"
                  sleep "$1"
                done
              ' "supervisor:opencode-serve" "$RESTART_DELAY" "$OC_PORT" \
              >>/tmp/opencode-serve.log 2>&1 ) &
          fi

          # Start the OpenChamber supervisor unless already running. OpenChamber
          # normally daemonizes; run it with OPENCHAMBER_NO_DAEMON so it stays in
          # the foreground and the supervisor can see it exit (and thus restart
          # it after a self-update). It inherits OPENCODE_SERVER_PASSWORD to
          # authenticate to the managed server. The sandbox is the security
          # boundary, so OpenChamber's own LAN access is unauthenticated.
          # argv to the inner sh -c: $0=marker, $1=RESTART_DELAY, $2=OC_PORT,
          # $3=CHAMBER_PORT.
          if ! supervisor_running openchamber; then
            ( sh -c '
                while :; do
                  echo "[supervisor] starting openchamber at $(date -u +%FT%TZ)"
                  OPENCODE_SKIP_START=true \
                  OPENCODE_PORT="$2" \
                  OPENCHAMBER_ALLOW_UNAUTHENTICATED_LAN=true \
                  OPENCHAMBER_NO_DAEMON=true \
                    openchamber --lan --port "$3" || true
                  echo "[supervisor] openchamber exited; restarting in ${1}s"
                  sleep "$1"
                done
              ' "supervisor:openchamber" "$RESTART_DELAY" "$OC_PORT" "$CHAMBER_PORT" \
              >>/tmp/openchamber.log 2>&1 ) &
          fi
      user: "1000"
      background: true
      description: Install (first boot) and supervise the managed opencode server + OpenChamber

agentContext: |
  ## OpenChamber (web UI for OpenCode)

  This sandbox runs **OpenChamber**, a browser UI for OpenCode, in the
  background on container port 3000. A managed `opencode serve` runs on
  `127.0.0.1:4096`; OpenChamber drives that server.

  **Reaching it from the host.** The kit declares container port 3000, which
  sbx maps to an ephemeral host port on 127.0.0.1, allocated per sandbox (so
  multiple sandboxes running this kit don't collide — each gets its own host
  port). Find the assigned port and open it:

  ```
  sbx ports <sandbox>        # or: acq ports <sandbox> — lists the host port for container 3000
  # then open http://127.0.0.1:<host-port>
  ```

  For a stable/chosen host port, publish it explicitly:
  `sbx ports <sandbox> --publish 3000:3000`.

  **Session sharing (important).** The terminal TUI you get from
  `sbx run <sandbox>` / `acq run opencode` starts its OWN in-process OpenCode
  server, so it does **not** share live session state with the OpenChamber
  browser (which uses the managed server on `:4096`). Session *history* is on
  disk and reachable from both, but a live, in-flight run is not shared.

  To drive the **same** server from a terminal — so the terminal and the
  browser share one live session — attach to the managed server instead of
  launching a fresh TUI. The managed server requires Basic auth with a
  per-sandbox password the kit generated; pass it via `OPENCODE_SERVER_PASSWORD`:

  ```
  sbx exec <sandbox> -- sh -lc \
    'OPENCODE_SERVER_PASSWORD="$(cat ~/.local/state/openchamber/opencode-server-password)" \
       opencode attach http://127.0.0.1:4096'
  ```

  Logs: `/tmp/openchamber.log` and `/tmp/opencode-serve.log` inside the sandbox.
  Both services run under a respawn loop, so if `opencode serve` or OpenChamber
  exits — for example after an interactive self-update, which needs a restart to
  take effect — it comes back a few seconds later on its own. Those logs show
  `[supervisor] ... restarting` lines when that happens.
