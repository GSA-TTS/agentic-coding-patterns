# CI — Pattern Validation
# Consumes reusable workflows from playbook where applicable

name: CI — Pattern Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python quality via reusable workflow
  python:
    uses: GSA-TTS/agentic-coding-playbook/.github/workflows/reusable-python-quality.yml@workflows/v1
    with:
      python-version: '3.13'
      scripts-path: 'scripts/'
      run-tests: true
      test-path: 'scripts/tests/'
      run-pip-audit: true

  # Python 3.12 compatibility check (additional matrix dimension)
  python-compat:
    name: Python 3.12 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          if [ -d "scripts/tests" ] && [ "$(ls -A scripts/tests/*.py 2>/dev/null)" ]; then
            pytest scripts/tests/ -v
          else
            echo "::notice::No tests found in scripts/tests/ - skipping"
          fi

  # Markdown quality via reusable workflow
  markdown:
    uses: GSA-TTS/agentic-coding-playbook/.github/workflows/reusable-markdown-quality.yml@workflows/v1
    with:
      run-link-check: true
      continue-on-link-error: false

  # Validation job (pattern-specific)
  validate:
    name: Pattern Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run validation
        run: make validate
