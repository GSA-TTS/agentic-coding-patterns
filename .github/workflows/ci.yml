# CI — Pattern Validation

name: CI — Pattern Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python quality
  python:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check scripts/

      - name: Ruff format check
        run: ruff format --check scripts/

      - name: Run tests
        run: |
          if [ -d "scripts/tests" ] && [ "$(ls -A scripts/tests/*.py 2>/dev/null)" ]; then
            pytest scripts/tests/ -v
          else
            echo "::notice::No tests found in scripts/tests/ - skipping"
          fi

      - name: Scan for unsafe shell patterns
        run: python scripts/scan_unsafe_shell.py .

      - name: SCA vulnerability scan
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip-audit --skip-editable

  # Python 3.12 compatibility check
  python-compat:
    name: Python 3.12 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          if [ -d "scripts/tests" ] && [ "$(ls -A scripts/tests/*.py 2>/dev/null)" ]; then
            pytest scripts/tests/ -v
          else
            echo "::notice::No tests found in scripts/tests/ - skipping"
          fi

  # Markdown quality with lockfile
  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '.github/linters/package-lock.json'

      - name: Install linter dependencies
        working-directory: .github/linters
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Run markdownlint
        run: npx --prefix .github/linters markdownlint-cli2 "**/*.md" "#node_modules" "#.github/linters/node_modules" "#templates" "#CHANGELOG.md"

  # Link check
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # External URLs can be flaky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Substitute the read-only workflow token into the link-check config so
      # github.com links are checked AUTHENTICATED (5000/hr) instead of at the
      # ~60/hr anonymous limit that produced 0/503 throttling false-positives
      # (#316). envsubst only touches the ${MLC_GITHUB_TOKEN} placeholder.
      - name: Authenticate link-check for github.com rate limits
        env:
          MLC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          MLC_GITHUB_TOKEN="$MLC_GITHUB_TOKEN" \
            envsubst '${MLC_GITHUB_TOKEN}' \
            < .markdown-link-check.json > .markdown-link-check.ci.json

      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          config-file: ".markdown-link-check.ci.json"
          use-quiet-mode: "yes"
          folder-path: "."
          check-modified-files-only: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
          base-branch: "main"

  # Validation job (pattern-specific)
  validate:
    name: Pattern Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run validation
        run: make validate

      - name: Run pattern test cases (skill assertions)
        run: make test-cases

      - name: Check generated files are current (INDEX.yaml + CATALOG.md)
        run: make generate-check

      - name: Validate acq-kits (hybrid/v1 schema)
        run: make validate-kits

  # acq-kits node test suites (offline, no sandbox required)
  acq-kits:
    name: acq-kits Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run acq-kits node tests
        run: make test-kits
