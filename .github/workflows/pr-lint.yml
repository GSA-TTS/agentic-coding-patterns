name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    steps:
      # On merge_group the PR object is absent; emit a pass so the required
      # context is satisfied.  The title was already validated when the PR
      # entered the queue.
      - name: Skip title check (merge_group)
        if: github.event_name == 'merge_group'
        run: echo "merge_group event — PR title already validated; skipping."

      - name: Validate conventional commit title (pull_request)
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            ci
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            PR title must follow conventional commits format:
            type: description (e.g., "feat: add new feature")
            Valid types: feat, fix, docs, chore, refactor, test, perf, ci
