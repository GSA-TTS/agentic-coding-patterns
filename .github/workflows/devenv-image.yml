name: devenv image

on:
  push:
    branches:
      - main
    paths:
      - integrations/isolation/images/devenv/**
      - .github/workflows/devenv-image.yml
  workflow_dispatch:

concurrency:
  group: devenv-image-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: shell
            base: docker/sandbox-templates:shell-docker
            arch: amd64
            runner: ubuntu-latest
          - variant: shell
            base: docker/sandbox-templates:shell-docker
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: opencode
            base: docker/sandbox-templates:opencode-docker
            arch: amd64
            runner: ubuntu-latest
          - variant: opencode
            base: docker/sandbox-templates:opencode-docker
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR requires a lowercase repository path.
      - name: Compute image name
        id: image
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/devenv-${VARIANT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only; the merge job assembles the multi-arch manifest
      # and applies the tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/isolation/images/devenv
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:cache-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.variant }} manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [shell, opencode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          VERSION=$(cat integrations/isolation/images/devenv/VERSION)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/devenv-${VARIANT}"
          cd /tmp/digests
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          VERSION=$(cat integrations/isolation/images/devenv/VERSION)
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY,,}/devenv-${VARIANT}:${VERSION}"
