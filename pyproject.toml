[project]
name = "agentic-coding-patterns-validation"
version = "0.1.0"
description = "Validation helpers for the agentic-coding-patterns repository"
requires-python = ">=3.12"
license = "CC0-1.0"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "pre-commit==4.6.1",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",  # assert used in tests
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["S101", "S106", "S603", "S607"]
"scripts/validate_repo.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
