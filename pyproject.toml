[project]
name = "agentic-coding-patterns-validation"
version = "0.1.0"
description = "Validation helpers for the agentic-coding-patterns repository"
requires-python = ">=3.11"
license = {text = "CC0-1.0"}
dependencies = [
    "PyYAML>=6.0.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
