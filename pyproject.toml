[project]
name = "agentic-coding-patterns-validation"
version = "0.1.0"
description = "Validation helpers for the agentic-coding-patterns repository"
requires-python = ">=3.12"
license = "CC0-1.0"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    "ruff==0.15.12",
    "pre-commit==4.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
