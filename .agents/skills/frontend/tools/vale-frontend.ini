# Vale configuration for frontend skills
# Based on cloud-gov/style-management-service profiles
#
# Usage:
#   vale --config tools/vale-frontend.ini docs/
#
# For full style packs, clone style-management-service:
#   git clone https://github.com/cloud-gov/style-management-service
#   vale --config style-management-service/profiles/uswds.vale.ini docs/

StylesPath = styles

MinAlertLevel = suggestion

# Core packages (install via: vale sync)
Packages = Google, proselint, write-good

[*]
BasedOnStyles = Google, proselint, write-good

# Markdown files: Full checks
[*.{md,markdown,mdx}]
BasedOnStyles = Google, proselint, write-good

# Plain language settings
Google.Passive = warning
Google.FirstPerson = NO
Google.We = NO
write-good.Passive = warning
write-good.Weasel = suggestion
write-good.TooWordy = warning
proselint.Jargon = warning
proselint.Cliches = suggestion

# Sentence length (approximation - full check in readability_score.py)
# write-good.LongSentence = warning

# HTML files: Lighter checks (mainly for alt text and link text)
[*.{html,htm}]
BasedOnStyles = Google
Google.Passive = suggestion

# Ignore code blocks and frontmatter
BlockIgnores = (?s)```.*?```, (?s)^---\n.*?\n---
TokenIgnores = `[^`]+`

# File exclusions
[*.min.js]
BasedOnStyles = 

[node_modules/*]
BasedOnStyles =

[.git/*]
BasedOnStyles =
