# Vale configuration for frontend skills
#
# This is the primary Vale configuration file for the frontend skills pack.
# It uses publicly available style packages that can be installed via `vale sync`.
#
# Usage:
#   cd .agents/skills/frontend/tools
#   vale sync                    # Download style packages
#   vale ../                     # Check all frontend skill markdown
#   vale ../../examples/frontend # Check examples
#
# For full cloud.gov style packs (18 packs, federal-specific rules):
#   git clone https://github.com/cloud-gov/style-management-service
#   vale --config style-management-service/profiles/documentation.vale.ini docs/

StylesPath = styles
MinAlertLevel = suggestion

# Core packages from Vale Package Hub
# Install with: vale sync
Packages = Google, proselint, write-good

# Default rules for all files
[*]
BasedOnStyles = Vale

# Markdown files: Full plain language checks
[*.{md,markdown,mdx}]
BasedOnStyles = Google, proselint, write-good

# Plain language enforcement
Google.Passive = warning
Google.FirstPerson = NO
Google.We = NO
write-good.Passive = warning
write-good.Weasel = suggestion
write-good.TooWordy = warning
write-good.E-Prime = NO
proselint.Jargon = warning
proselint.Cliches = suggestion

# HTML files: Lighter checks
[*.{html,htm}]
BasedOnStyles = Google
Google.Passive = suggestion

# Ignore patterns
BlockIgnores = (?s)```.*?```, (?s)^---\n.*?\n---
TokenIgnores = `[^`]+`

# Exclusions
[*.min.js]
BasedOnStyles = 

[node_modules/**]
BasedOnStyles =

[.git/**]
BasedOnStyles =

[__pycache__/**]
BasedOnStyles =
